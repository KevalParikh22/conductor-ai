* { box-sizing: border-box; }

.help:hover { color: var(--accent); border-color: var(--accent); }

.spacer { flex: 1; }

input[type=text], input[type=search], input[type=number], select { height: var(--ctl-h); }

label.f { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
label.chk { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; padding: 6px 0; } label.chk input { margin-top: 2px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; padding: 1px 9px; border-radius: 99px; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.local-agent, .pill.local-model { background: var(--local-soft); color: var(--local); } .pill.cloud-api { background: var(--cloud-soft); color: var(--cloud); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); flex: none; } .dot.ok { background: var(--ok); }
.dot.opt { background: transparent; border: 1.5px solid var(--muted); width: 7px; height: 7px; } /* optional: on by default, no key yet */

.chain { display: flex; flex-direction: column; gap: 4px; margin: 10px 0; }
.link { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: center; padding: 4px 6px 4px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); }
.link .idx { color: var(--muted); font-size: 12px; text-align: center; }

[hidden] { display: none !important; } /* layout rules like .gcard { display: flex } would otherwise show hidden elements */
.gcard { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--panel-2); display: flex; flex-direction: column; gap: 4px; }

.btn svg.i { width: 14px; height: 14px; }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); } .btn.ghost:hover { background: var(--panel-2); color: var(--text); }
.head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; } .head h1 { margin: 0; } .head .sub { margin: 2px 0 0; flex-basis: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; } .seg button { border: 0; background: var(--panel); color: var(--muted); padding: 0 14px; min-height: var(--ctl-h); font: inherit; font-size: 14px; cursor: pointer; } .seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.plist { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 14px; }
.prow { border-bottom: 1px solid var(--line); } .prow:last-child { border-bottom: 0; }
.prow-main { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 18px; }

.prow-body { padding: 0 18px 16px 66px; } .prow.open { background: var(--panel-2); }
.chev { transition: transform .15s; } .prow.open .chev { transform: rotate(180deg); }
.kind { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; flex: none; } .kind svg.i { width: 16px; height: 16px; }
.kind.local-agent { background: var(--local-soft); color: var(--local); } .kind.cloud-api { background: var(--cloud-soft); color: var(--cloud); }
.kind.local-model { background: var(--ok-soft); color: var(--ok); } .kind.manual { background: var(--panel-2); color: var(--muted); }
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 500; white-space: nowrap; color: var(--muted); }
.st svg.i { width: 16px; height: 16px; } .st.ok { color: var(--ok); } .st.warn { color: var(--warn); } .st.bad { color: var(--bad); }
.why { margin: 2px 0 10px; font-size: 13.5px; }
.roles { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); } .roles .card { margin: 0; }
.trend { display: flex; gap: 10px; align-items: flex-end; } .tw { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 40px; font-size: 12.5px; }

.tbar span { display: block; width: 100%; background: var(--muted); } .tbar span.ok { background: var(--ok); } .tbar span.low { background: var(--warn); }
.rtabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.rtab { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; }

.prov { display: grid; grid-template-columns: auto 1fr; gap: 12px; }
.prov-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.prov-head b { font-size: 14.5px; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 10px; }
.note { color: var(--muted); font-size: 13.5px; }

.callout ul { margin: 0; padding-left: 18px; } .callout li { margin: 3px 0; }
.pathbox { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 13.5px; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 2px 4px 2px 10px; }
/* Settings: one control per line, label left, help under the label */
.setlist { display: grid; }
.setrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 340px); gap: 8px 24px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }

.cmdrow:last-child { border-bottom: 0; } .cmdrow pre.cmd { margin: 0; }

.agent pre.cmd { background: var(--panel); }

.soon p { max-width: 560px; margin: 10px auto; } .soon pre.cmd { max-width: 360px; margin: 6px auto; text-align: left; }

.dlg-b { padding: 20px 22px; } .dlg-b h2 { margin-bottom: 6px; }
.dlg-f { display: flex; gap: 10px; justify-content: flex-end; padding: 14px 22px; border-top: 1px solid var(--line); background: var(--panel-2); border-radius: 0 0 12px 12px; flex-wrap: wrap; }
.explain ol { margin: 4px 0 0; padding-left: 20px; } .explain li { margin: 2px 0; }
.lib { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); } .lib .item { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; overflow-wrap: anywhere; }
.lib .item .row { gap: 6px; } .lib .item .note { display: block; margin-top: 2px; }
.switch { position: relative; width: 34px; height: 20px; flex: none; }
.switch input[type=checkbox] { opacity: 0; width: 0; height: 0; position: absolute; }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 99px; cursor: pointer; transition: .15s; }

<body>
<header>

</div>

<script>
const TOKEN = new URLSearchParams(location.hash.slice(1)).get('t') || '';

}

  chip: 'M5 5h14v14H5zM9 9h6v6H9zM9 1v4M15 1v4M9 19v4M15 19v4M1 9h4M1 15h4M19 9h4M19 15h4',

};
const icon = (n, t = '') => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"${t ? ` title="${t}"` : ''}><path d="${ICONS[n]}"/></svg>`;
// Lessons & rules has no nav item; #p=lessons still opens it
const TABS = [['overview', 'Overview'], ['runs', 'Runs'], ['roles', 'Roles'], ['routing', 'Routing rules'], ['providers', 'Providers'], ['skills', 'Skills'], ['keys', 'API keys'], ['settings', 'Settings'], ['setup', 'Setup']];
let S = null, W = null, tab = pageFromHash(), dirty = false, freeModels = null, runsData = null, gOpen = null, gFilter = { q: '', cat: 'all' };
let rPreview = null; // routing preview result
let runOpen = new URLSearchParams(location.hash.slice(1)).get('run'), runDet = null; // the run page (#p=runs&run=<id>)
let ctrlPick = null; // controller picked in Settings but not applied yet (a project action, not part of Save)
let rtLib = null, rtLibKey = '', rtLibOpen = null; // rule library, resolved against the current (unsaved) providers
const ROUTING_GUIDE = 'https://github.com/KevalParikh22/conductor-ai/blob/main/docs/ROUTING.md';
function loadRtLib() {
  const key = JSON.stringify([Object.keys(W.providers).filter((n) => W.providers[n].enabled), (W.routes || []).map((r) => r.from)]);
  if (key === rtLibKey) return; rtLibKey = key;
  api('POST', '/api/route-templates', { providers: W.providers, routes: W.routes || [] }).then((d) => { rtLib = d.templates; if (tab === 'routing') render(); }, () => {});
}
let localInfo = null, localAt = 0; // local model servers, refreshed at most every 30s
function loadLocal() { if (Date.now() - localAt < 30000) return; localAt = Date.now(); api('GET', '/api/local').then((d) => { localInfo = d.local; if (tab === 'providers' || tab === 'setup') render(); }, () => {}); }
let pAll = false, pAdd = false; const pOpen = new Set(); // providers page: show disabled, gallery open, expanded rows
const provModels = {};
const GUIDE = (id) => `https://github.com/KevalParikh22/conductor-ai/blob/main/docs/providers/${id}.md`;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

try { const t = localStorage.getItem('conductor-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}

$('#theme').onclick = () => {
  const next = curTheme() === 'dark' ? 'light' : 'dark';

  try { localStorage.setItem('conductor-theme', next); } catch {}
};

// the browser says only "Failed to fetch" when the page can't reach its server: say what that means here
const OFFLINE = 'Can\'t reach conductor-ai ui: its server has stopped (the terminal that ran `conductor-ai ui` was closed, or it was stopped). Run `conductor-ai ui` again and use the new link. Nothing was saved.';
async function api(method, path, body) {

const scopeText = () => ($('#scope').value === 'global' ? 'global config (all projects)' : 'this project');
function markDirty() { dirty = true; $('#savebar').classList.add('show'); $('#savewhere').textContent = 'Will save to ' + scopeText(); }
// the full path is long and mostly the same prefix: show the folder, keep the path in the tooltip and the copy button
const baseName = (p) => String(p || '').replace(/[\\/]+$/, '').split(/[\\/]/).pop() || p;

$('#save').onclick = () => {

};
$('#cf-cancel').onclick = () => $('#confirm').close();
$('#cf-save').onclick = async () => {
  const scope = $('#scope').value; $('#confirm').close();
  try {
    const r = await api('PUT', '/api/config', { scope, effective: W }); load(r);
    if (scope === 'global' && r.shadowed?.length) toast(`Saved globally. This project overrides: ${r.shadowed.join(', ')}`, 7000);

$('#brand').onclick = (e) => { e.preventDefault(); go('overview'); };

// notifications: config notices (retired providers, a removed controller) and the newest CHANGELOG entries
let whatsNew = null;
function bellIcon() { $('#bell').innerHTML = icon('bell') + (S?.notices?.length ? '<span class="bdot" aria-hidden="true"></span>' : ''); $('#bell').title = S?.notices?.length ? `Notifications (${S.notices.length})` : 'Notifications'; }
function renderPanel() {
  const n = S?.notices || [], secs = whatsNew?.sections || [];
  $('#npanel').innerHTML = `${n.length ? `<h3>Needs attention</h3>${n.map((x) => `<div class="notice">${esc(x)}</div>`).join('')}` : ''}
    ${secs.length ? `<h3>What's new</h3>${secs.map((s) => `<div class="ver">${esc(s.heading)}</div><ul>${s.items.map((i) => `<li>${esc(i)}</li>`).join('')}</ul>`).join('')}` : ''}

$('#bell').onclick = (e) => { e.stopPropagation(); togglePanel($('#npanel').hidden); };

$('#scope').onchange = () => { if (dirty) markDirty(); try { localStorage.setItem('conductor-scope', $('#scope').value); } catch {} };

function renderNav() {

function provStatus(name) { return S.status.providers.find((p) => p.name === name) || { ready: false, reason: 'unknown' }; }

const LOC_ICON = { 'local-agent': 'agent', 'local-model': 'server', 'cloud-api': 'cloud', manual: 'manual' };

function copyIcon(text, done = 'Copied', label = 'Copy') { return `<button class="btn icon ghost copyi" data-copy="${esc(text)}" data-copied="${esc(done)}" title="${esc(label)}" aria-label="${esc(label)}">${icon('copy')}</button>`; }

let lessonsData = null, rulesData = null, statsData = null, guardData = null; // V3: same actions as the CLI and MCP
function loadLessons() { Promise.all([api('GET', '/api/lessons'), api('GET', '/api/rules')]).then(([l, r]) => { lessonsData = l; rulesData = r; if (tab === 'lessons') render(); }, (e) => toast(e.message)); }
function loadOverviewExtras() { Promise.all([api('GET', '/api/stats'), api('GET', '/api/guard')]).then(([st, g]) => { statsData = st; guardData = g; if (tab === 'overview') render(); }, () => { statsData = statsData || {}; guardData = guardData || {}; }); }
let runsAt = 0;
function loadRuns() { runsAt = Date.now(); api('GET', '/api/runs').then((d) => { runsData = d; if (tab === 'runs') render(); }, (e) => toast(e.message)); }
// keep the Runs page current while it is open (runs started from the terminal show up on their own):
// every 2s while a run is going, so its step stays current; every 5s otherwise; at once when you come back to the tab
const runsShown = () => tab === 'runs' && !runOpen && document.visibilityState === 'visible';
// the open run page too: every 2s while it runs, every 5s after (a recheck from the terminal or cron changes it)
let runAt = 0;
const runShown = () => tab === 'runs' && runOpen && document.visibilityState === 'visible';
setInterval(() => {
  if (runsShown() && (runsData?.runs?.some((r) => r.state === 'running') || Date.now() - runsAt >= 5000)) loadRuns();
  if (runShown() && runDet && (runDet.state === 'running' || Date.now() - runAt >= 5000)) fetchRun(runOpen, { quiet: true });
}, 2000);
document.addEventListener('visibilitychange', () => { if (runsShown()) loadRuns(); if (runShown()) fetchRun(runOpen, { quiet: true }); });
let recheckBusy = null; // which runs are being checked again: [] = every failed one
async function recheck(ids = []) {
  recheckBusy = ids; render();
  try {
    const { rows } = await api('POST', '/api/recheck', { ids });
    const pass = rows.filter((r) => r.after === 'PASS').length, fail = rows.filter((r) => r.after === 'FAIL').length, skip = rows.filter((r) => r.skipped).length;
    toast(rows.length ? `Verify run again: ${pass} pass, ${fail} still fail${skip ? `, ${skip} skipped (${rows.find((r) => r.skipped).skipped})` : ''}` : 'No run with a failed verify to check again', 6000);
  } catch (e) { toast(e.message); }
  recheckBusy = null;
  if (runOpen) { runDet = null; fetchRun(runOpen); }
  loadRuns();
}
const elapsed = (iso) => { const s = Math.max(0, Math.round((Date.now() - new Date(iso)) / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
// a running step's timer: ticks every second in place, so the page itself only redraws when the run's data changes
const ticker = (iso) => `<span data-since="${esc(iso)}">${elapsed(iso)}</span>`;
setInterval(() => document.querySelectorAll('[data-since]').forEach((el) => { el.textContent = elapsed(el.dataset.since); }), 1000);
function openRun(id) {
  runOpen = id; runDet = null;
  const h = new URLSearchParams(location.hash.slice(1)); if (id) h.set('run', id); else h.delete('run');
  history.pushState(null, '', `#${h}`);
  render();
}
let runFetching = null;
// quiet: a background refresh. It redraws only when something changed, and a failed one leaves the page as it is.
function fetchRun(id, { quiet = false } = {}) {
  if (runFetching === id) return;
  runFetching = id; runAt = Date.now();
  api('GET', `/api/run?id=${encodeURIComponent(id)}`).then((d) => {
    runFetching = null;
    if (runOpen !== id || (quiet && JSON.stringify(d) === JSON.stringify(runDet))) return;
    runDet = d; if (tab === 'runs') render();
  }, (e) => { runFetching = null; if (quiet) return; toast(e.message); runOpen = null; render(); });
}
function overviewExtras() {
  if (!statsData || !guardData) { loadOverviewExtras(); return ''; }
  const q = statsData.quality, g = guardData;
  const quality = q ? `<div class="card stat"><div class="l" title="Done with one worker, no hand-off or retry (conductor-ai stats)">Accepted first try (${q.days} days)</div><div class="n">${q.writeTasks ? `${q.firstTryRate}%` : '–'}</div><div class="note">${q.writeTasks ? `${q.firstTry} of ${q.writeTasks} write tasks · alpha gate: ${esc(q.gate)}` : 'no write tasks yet'}</div></div>` : '';
  const guard = g.controller ? `<div class="card stat"><div class="l" title="conductor-ai guard">Push guard</div><div class="n" style="font-size:16px">${!g.supported ? 'not available' : g.on ? 'on' : 'off'}</div><div class="note">${g.supported ? `blocks the controller's git push while the last verify failed (commits are fine) · last verify: ${g.lastVerify ? esc(g.lastVerify.status) : 'none'}` : 'only Claude Code and Antigravity'}</div>${g.supported ? `<button class="btn small" id="guard-toggle" style="margin-top:6px">${g.on ? 'Turn off' : 'Turn on'}</button>` : ''}</div>` : '';
  // failure causes (this project's runs, then worker attempts everywhere) and the weekly first-try trend
  const f = statsData.failures || {};
  const causes = (f.causes || []).slice(0, 4), kinds = (f.attempts || []).slice(0, 3);
  const why = causes.length || kinds.length ? `<div class="card"><h2>Why work failed (${f.days} days)</h2>
    ${causes.length ? `<table><tr><th>Runs not done</th><th>How many</th></tr>${causes.map((c) => `<tr><td>${esc(c.cause)}</td><td>${c.count}</td></tr>`).join('')}</table>` : '<p class="note">Every run in this project ended done.</p>'}
    ${kinds.length ? `<p class="note" style="margin-top:8px">Failed worker attempts (all projects): ${kinds.map((k) => `${esc(k.kind)} <b>${k.count}</b>`).join(' · ')}. Details: <span class="mono">conductor-ai stats --failures</span></p>` : ''}</div>` : '';
  const tr = statsData.trend || [];
  const trend = tr.some((w) => w.writeTasks) ? `<div class="card"><h2>Accepted first try, by week</h2><div class="trend">${tr.map((w) => `<div class="tw" title="${esc(`week of ${w.week}: ${w.writeTasks ? `${w.firstTry} of ${w.writeTasks} write tasks` : 'no write tasks'}`)}">
      <div class="tbar"><span style="height:${w.rate ?? 0}%" class="${w.rate == null ? '' : w.rate >= 70 ? 'ok' : 'low'}"></span></div><b>${w.rate == null ? '–' : `${w.rate}%`}</b><span class="note">${esc(w.week.slice(5))}</span></div>`).join('')}</div>
    <p class="note">The alpha gate is 70% or more over at least 10 write tasks. Hover a week for its numbers.</p></div>` : '';
  return `${quality || guard ? `<div class="grid">${quality}${guard}</div>` : ''}${why}${trend}`;
}
const GATE_PILL = { pass: 'ok', fail: 'bad', missing: 'bad', waived: 'warn', off: 'warn', skipped: '', unknown: 'warn', waiting: 'warn' };
function runPage() {
  const back = '<button class="btn small" id="run-back">← All runs</button>';
  if (!runDet) { fetchRun(runOpen); return `<div class="head">${back}<h1>Run</h1><p class="sub">Loading…</p></div>`; }
  const d = runDet;
  if (d.state === 'running') return `<div class="head">${back}<h1>${esc(d.role)}${d.task ? ` · ${esc(d.task)}` : ''}</h1>
    <p class="sub"><span class="mono">${esc(d.id)}</span> · <span class="pill warn">running</span>${d.startedAt ? ` · started ${esc(new Date(d.startedAt).toLocaleString())}` : ''}</p></div>
    <div class="card"><h2>Now</h2><p><b>${esc(d.step || 'working')}</b> · ${ticker(d.since || d.startedAt)}${d.limitMs ? ` <span class="note">of ${Math.round(d.limitMs / 60000)} min</span>` : ''}</p>
      <p class="note">This page follows the run. The checks, attempts, report and diff appear here when it finishes.</p></div>`;
  const det = (title, body, open = false) => body ? `<details class="card" ${open ? 'open' : ''}><summary><b>${title}</b></summary><pre class="cmd" style="max-height:480px">${esc(body)}</pre></details>` : '';
  const next = d.branch ? [`conductor-ai diff ${d.branch}`, `git merge --no-ff ${d.branch}`, `conductor-ai worktree rm ${d.worktreeId}`, `conductor-ai worktree rm ${d.worktreeId} --force`] : [];
  return `<div class="head">${back}<h1>${esc(d.role)}${d.task ? ` · ${esc(d.task)}` : ''}</h1>
    <p class="sub"><span class="mono">${esc(d.id)}</span>${d.plan ? ` · plan <span class="mono">${esc(d.plan)}</span>` : ''} · ${d.validated ? '<span class="pill ok">validated: every required check passed</span>' : '<span class="pill bad">not validated</span>'} · result <b>${esc(d.state)}</b></p></div>
    <div class="card"><div class="row"><h2 style="margin:0">Checks</h2><span class="spacer"></span>${d.canRecheck ? `<button class="btn small" id="run-recheck" ${recheckBusy ? 'disabled' : ''} title="Check out this run's commit again and run its verify command (conductor-ai runs recheck ${esc(d.id)})">${recheckBusy ? 'Running verify…' : '↻ Run verify again'}</button>` : ''}</div>
      <p class="note">A run counts as done only when every required check passes (or was waived on purpose). Info rows don't decide it.</p>
      <table><tr><th>Check</th><th>Result</th><th>Evidence</th></tr>${d.gates.map((g) => `<tr><td>${esc(g.label)}${g.required ? '' : ' <span class="note">(info)</span>'}</td>
        <td><span class="pill ${GATE_PILL[g.status] ?? ''}">${esc(g.status)}</span></td>
        <td>${esc(g.evidence || '')}${g.seconds != null ? ` <span class="note">(${g.seconds}s)</span>` : ''}${g.log && d.logs[g.id] ? `<details><summary class="note">log: <span class="mono">${esc(g.log)}</span></summary><pre class="cmd">${esc(d.logs[g.id])}</pre></details>` : ''}</td></tr>`).join('')}</table></div>
    <div class="card"><h2>Attempts</h2><table><tr><th>Worker</th><th>Result</th><th>Time</th><th>Tokens in / out</th><th>What to do</th></tr>${d.attempts.map((a) => `<tr>
      <td><b>${esc(a.provider)}</b>${a.model ? `<div class="note mono">${esc(a.model)}</div>` : ''}</td>
      <td>${a.ok ? '<span class="pill ok">ok</span>' : `<span class="pill ${a.skipped ? '' : /^waiting/.test(a.reason) ? 'warn' : 'bad'}">${esc(a.skipped ? 'skipped' : /^waiting/.test(a.reason) ? 'waiting' : 'failed')}</span><div class="note">${esc(a.reason)}</div>`}</td>
      <td>${a.seconds != null ? `${a.seconds}s` : ''}</td><td>${a.tokens ? `${(a.tokens.input || 0).toLocaleString()} / ${(a.tokens.output || 0).toLocaleString()}` : '–'}</td>
      <td class="note">${esc(a.next || '')}</td></tr>`).join('')}</table>
      ${d.warnings.length ? d.warnings.map((w) => `<div class="note">⚠ ${esc(w)}</div>`).join('') : ''}</div>
    ${d.waiting && !d.waiting.importedAs ? `<div class="card"><h2>Waiting for your answer</h2><p class="note">Paste this prompt (${d.waiting.chars} characters) into any web chat (DeepSeek, Kimi, Qwen, Gemini, ChatGPT…), then paste its whole answer below. conductor-ai applies and checks it like any worker's; it never opens the chat itself.</p>
      <div class="row"><button class="btn small" id="mw-copy">${icon('copy')} Copy prompt</button><span class="note mono">${esc(d.waiting.prompt)}</span></div>
      <textarea id="mw-answer" rows="10" style="width:100%;margin-top:8px;font-family:var(--mono);font-size:12.5px" placeholder="Paste the chat's answer here"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn primary" id="mw-import">Import the answer</button><span class="note">Same as <span class="mono">conductor-ai import ${esc(d.id)} answer.md</span></span></div></div>` : d.waiting?.importedAs ? `<div class="card"><h2>Answered</h2><p class="note">Your answer was imported as <a href="#" data-run="${esc(d.waiting.importedAs)}">run ${esc(d.waiting.importedAs)}</a>.</p></div>` : ''}
    ${next.length ? `<div class="card"><h2>Next</h2><p class="note">Review the diff, then merge it, or discard the branch. Run these in the project.</p>${cmd(next[0])}${cmd(next[1])}${cmd(next[2])}<p class="note">Discard instead:</p>${cmd(next[3])}</div>` : ''}
    ${d.changed.length ? `<div class="card"><h2>Files changed</h2><div class="mono">${d.changed.map(esc).join('<br>')}</div></div>` : ''}
    ${det('Report', d.report, true)}${det('Diff', d.diff)}`;
}

const gMatch = (c) => (gFilter.cat === 'all' || c.category === gFilter.cat || (gFilter.cat === 'free' && !!c.free))
  && (!gFilter.q || `${c.id} ${c.label} ${c.about} ${c.free || ''}`.toLowerCase().includes(gFilter.q.toLowerCase()));

        <a class="note" href="${GUIDE(c.id)}" target="_blank" rel="noopener">guide</a></div>

      ${c.free ? `<p class="note"><b>Free:</b> ${esc(c.free.replace(/^Free:\s*/i, ''))}</p>` : ''}

    </div>`;
  // added first, then what runs on this machine, then everything else: one heading each instead of one long grid

    <p class="note" id="g-none" style="margin-top:12px" ${S.catalog.some(gMatch) ? 'hidden' : ''}>Nothing matches. Any OpenAI-compatible endpoint works: add it as a custom provider below.</p>

function applyGalleryFilter() {
  document.querySelectorAll('[data-gid]').forEach((el) => { el.hidden = !gMatch(S.catalog.find((c) => c.id === el.dataset.gid)); });
  document.querySelectorAll('[data-gsec]').forEach((el) => { el.hidden = !el.querySelector('.gcard:not([hidden])'); });
  document.querySelectorAll('[data-gcat]').forEach((b) => { b.classList.toggle('on', b.dataset.gcat === gFilter.cat); b.setAttribute('aria-pressed', String(b.dataset.gcat === gFilter.cat)); });

  const n = $('#g-count'); if (n) n.textContent = `${S.catalog.filter(gMatch).length} shown`;

    </div>
    <div class="card"><div class="row" style="margin-bottom:8px"><h2 style="margin:0">Recent runs</h2><span class="spacer"></span>${failed || recheckBusy ? `<button class="btn small" id="runs-recheck" ${recheckBusy ? 'disabled' : ''} title="For each run whose verify failed: check out the code it made and run its verify again (conductor-ai runs recheck). Use it after fixing something outside the code, like a missing package.">${recheckBusy ? 'Running verify again… (this can take a while)' : `↻ Recheck failed runs (${failed})`}</button>` : ''}</div>${runs.length ? `<table><tr><th>When</th><th>Role · task</th><th>Result</th><th>Worker</th><th>Verify</th><th>Files</th><th>Time</th></tr>
      ${runs.map((r) => `<tr><td class="mono">${r.state === 'running' && !r.startedAt ? esc(r.id) : `<a href="#" data-run="${esc(r.id)}" title="Checks, attempts, report and diff">${esc(r.startedAt ? new Date(r.startedAt).toLocaleString() : r.id)}</a>`}</td>
        <td><b>${esc(r.role)}</b>${r.task ? ` · ${esc(r.task)}` : ''}${r.branch ? `<div class="note mono">${esc(r.branch)}</div>` : ''}</td>

      <p class="note" style="margin-bottom:0"><a href="https://github.com/KevalParikh22/conductor-ai/blob/main/SECURITY.md" target="_blank" rel="noopener">Security policy (SECURITY.md)</a></p></div>`;
  },
  setup() {
    const p = S.presets, sec = Object.fromEntries(S.secrets.map((x) => [x.name, x.set]));
    // red only for what conductor-ai needs (git, Node); optional things (an agent you don't use, a project not set up yet) stay neutral
    const pill = (ok, yes, no, level = 'bad') => ok ? `<span class="pill ok">${yes}</span>` : `<span class="pill ${level}">${no}</span>`;

    const freeKeys = ['OPENROUTER_API_KEY', 'OPENCODE_API_KEY', 'GEMINI_API_KEY', 'GROQ_API_KEY', 'CEREBRAS_API_KEY'].filter((n) => sec[n]).length;
    const step = (c, what) => `<div class="cmdrow"><div>${what}</div>${cmd(c)}</div>`;
    const agentCard = ([k, v]) => { const label = esc(v.label.replace(/ \(as a worker\)$/, '')), alt = /\(or: /.test(v.install) ? v.install.split(/\(or: /)[1].replace(/\)$/, '') : '';
      return `<div class="agent"><div class="row"><b>${label}</b>${v.beta ? '<span class="pill" title="Newer agent: works, less tested">beta</span>' : ''}<span class="spacer"></span>${v.installed ? `<span class="st ok">${icon('ok')}installed</span>` : '<span class="st">not installed</span>'}</div>
        ${k === S.controllerPreset ? '<span class="note">Your controller, so off as a worker (it would spend the quota conductor-ai saves).</span>' : ''}
        ${v.installed ? '' : `<span class="note">Install</span>${cmd(v.install.split(/\s+\(or: /)[0])}${alt ? `<span class="note">or: <span class="mono">${esc(alt)}</span></span>` : ''}`}
        ${v.login ? `<span class="note">Sign in</span>${cmd(v.login.split(/\s+\(/)[0])}${/\s\(/.test(v.login) ? `<span class="note">${esc(v.login.slice(v.login.search(/\s\(/)).trim().replace(/^\(|\)$/g, ''))}</span>` : ''}` : ''}</div>`; };
    return `<div class="head"><h1>Setup</h1><p class="sub">What this machine has, what to run next, and how to connect your coding agents and editors (<a href="https://github.com/KevalParikh22/conductor-ai/blob/main/docs/GUIDE.md" target="_blank" rel="noopener">full guide</a>).</p></div>
    <div class="card"><h2>This system</h2><table><tr><th>Check</th><th>Status</th><th>How to fix</th></tr>
      <tr><td>Node.js 20+</td><td>${pill(+S.env.node.slice(1).split('.')[0] >= 20, esc(S.env.node), esc(S.env.node) + ' (too old)')}</td><td class="note">${+S.env.node.slice(1).split('.')[0] >= 20 ? '' : 'Install Node 20 or newer (e.g. <span class="mono">nvm install 22</span>)'}</td></tr>
      <tr><td>git</td><td>${pill(S.env.git, 'installed', 'missing')}</td><td class="note">Needed for worktrees, checks and rollback</td></tr>
      <tr><td>conductor-ai ${esc(S.version)}</td><td>${pill(S.env.conductorOnPath, 'on PATH', 'not on PATH')}</td><td class="note">${S.env.conductorOnPath ? '' : 'Add <span class="mono">$(npm prefix -g)/bin</span> to PATH'}</td></tr>
      <tr><td>This project</td><td>${pill(S.hasProjectConfig, 'set up', 'not set up yet', '')}</td><td class="mono">${S.hasProjectConfig ? '' : 'conductor-ai init'}</td></tr>
      <tr><td>Coding agents</td><td>${found.length ? `<span class="pill ok">${found.length} found</span>` : '<span class="pill">none found</span>'}</td><td class="note">${found.length ? found.map((v) => esc(v.label.replace(/ \(as a worker\)$/, ''))).join(', ') : 'Optional: free API providers work without one'}</td></tr>
      <tr><td>Local models</td><td>${(() => { loadLocal(); const run = (localInfo || []).filter((l) => l.running); return !localInfo ? '<span class="pill">checking…</span>' : run.length ? `<span class="pill ok">${run.map((l) => esc(l.label)).join(', ')}</span>` : '<span class="pill">none running</span>'; })()}</td><td class="note">${(localInfo || []).find((l) => l.next)?.next ? esc((localInfo || []).find((l) => l.next).next) : 'Optional: <a href="https://ollama.com/download" target="_blank" rel="noopener">Ollama</a>, then <span class="mono">ollama pull qwen3-coder</span>'}</td></tr>
      <tr><td>Free API keys</td><td>${freeKeys ? `<span class="pill ok">${freeKeys} set</span>` : '<span class="pill">none yet</span>'}</td><td class="note">kilo-free works without a key</td></tr>
    </table></div>
    <div class="card"><h2>What to do next</h2>
      ${step('conductor-ai setup', '<b>Once per machine.</b> Finds your agents and keys, adds a free provider and tests it.')}
      ${step('cd my-project\nconductor-ai init', '<b>In each project.</b> Writes AGENTS.md, your controller\'s commands and its MCP entry, and detects the Verify command. Pick another controller with <span class="mono">--controller</span>.')}
      ${step('conductor-ai demo', '<b>See it work</b> on a throwaway project: two tasks handed out in parallel, merged and tested (about 2 minutes).')}
      ${step('conductor-ai doctor --live', '<b>Check everything.</b> <span class="mono">--live</span> sends one tiny prompt to each enabled provider.')}
      ${step('conductor-ai ui', '<b>Open this page</b> again later.')}
      <p class="note" style="margin-bottom:0">Update with <span class="mono">npm install -g conductor-ai</span>; remove with <span class="mono">npm uninstall -g conductor-ai</span>. Settings and keys stay in <span class="mono">${esc(tilde(S.paths.global.replace(/[^/\\]+$/, '')))}</span>.</p></div>
    <div class="card"><h2>Coding agents</h2><p class="note" style="margin-top:-4px">${found.length} of ${Object.keys(p).length} installed. Agents edit files and run tests themselves, each under its own permission rules. After installing one, run <span class="mono">conductor-ai setup</span> or switch it on in <a href="#" data-goto="providers">Providers</a>.</p>
      <div class="agents">${Object.entries(p).map(agentCard).join('')}</div></div>

      ${cmd('conductor-ai mcp')}
      <div class="cmdrow"><div><b>Codex</b> <span class="note">reads MCP servers from its own config: register once for all projects</span></div>${cmd('codex mcp add conductor-ai -- conductor-ai mcp')}</div>

      <div class="cmdrow"><div><b>VS Code</b> <span class="note">writes <span class="mono">.vscode/mcp.json</span> (also done when the project already has a .vscode folder)</span></div>${cmd('conductor-ai init --vscode')}</div></div>`;
  },
};

function render() {
  renderNav();
  // a redraw (a live refresh) keeps the sections you opened open
  const page = `${tab}|${runOpen || ''}`, same = page === render.page; render.page = page; // only within the same page
  const was = new Map(same ? [...document.querySelectorAll('#main details > summary')].map((x) => [x.textContent, x.parentElement.open]) : []);
  $('#main').innerHTML = views[tab]();
  if (was.size) document.querySelectorAll('#main details > summary').forEach((x) => { if (was.has(x.textContent)) x.parentElement.open = was.get(x.textContent); });
  bindCopy(); bind();
}

function bind() {
  const la = $('#ls-add'); if (la) la.onclick = async () => { try { lessonsData = await api('POST', '/api/lessons/add', { text: $('#ls-text').value.trim(), files: $('#ls-files').value.split(',').map((x) => x.trim()).filter(Boolean) }); render(); toast('Lesson added'); } catch (e) { toast(e.message); } };
  document.querySelectorAll('[data-lsrm]').forEach((b) => b.onclick = async () => { try { lessonsData = await api('POST', '/api/lessons/remove', { id: b.dataset.lsrm }); render(); toast('Removed'); } catch (e) { toast(e.message); } });
  document.querySelectorAll('[data-lspromote]').forEach((b) => b.onclick = async () => { try { const r = await api('POST', '/api/lessons/promote', { id: b.dataset.lspromote }); lessonsData = r; render(); toast(`Added to AGENTS.md: ${r.bullet}`); } catch (e) { toast(e.message); } });
  const gt = $('#guard-toggle'); if (gt) gt.onclick = async () => { try { guardData = await api('POST', '/api/guard', { on: !guardData.on }); render(); toast(`Push guard ${guardData.on ? 'on' : 'off'}`); } catch (e) { toast(e.message); } };
  document.querySelectorAll('[data-run]').forEach((a) => a.onclick = (e) => { e.preventDefault(); openRun(a.dataset.run); });
  const rb = $('#run-back'); if (rb) rb.onclick = () => { openRun(null); loadRuns(); };
  const rr = $('#runs-recheck'); if (rr) rr.onclick = () => recheck();
  const r1 = $('#run-recheck'); if (r1) r1.onclick = () => recheck([runDet.id]);
  const mc = $('#mw-copy'); if (mc) mc.onclick = () => navigator.clipboard?.writeText(runDet?.waiting?.promptText || '').then(() => toast('Prompt copied: paste it into the web chat'), () => toast('Copy failed: open the prompt file'));
  const mi = $('#mw-import'); if (mi) mi.onclick = async () => {
    const text = $('#mw-answer').value.trim();
    if (!text) { toast('Paste the answer first'); return; }
    mi.disabled = true; mi.textContent = 'Checking the answer…';
    try { const r = await api('POST', '/api/import', { run: runDet.id, text }); toast(`Imported as run ${r.run}: ${r.outcome || 'done'}`); openRun(r.run); } catch (e) { toast(e.message); mi.disabled = false; mi.textContent = 'Import the answer'; }
  };
  document.querySelectorAll('[data-goto]').forEach((b) => b.onclick = (e) => { e.preventDefault(); go(b.dataset.goto); }); // links too: "#" would drop the token
  document.querySelectorAll('[data-clear]').forEach((b) => b.onclick = async () => { load(await api('POST', '/api/cooldowns/clear', { name: b.dataset.clear })); toast('Cooldown cleared'); });
  document.querySelectorAll('[data-mv]').forEach((b) => b.onclick = () => { const [r, i, d] = b.dataset.mv.split('|'); const c = W.roles[r]; const j = +i + +d; [c[i], c[j]] = [c[j], c[i]]; markDirty(); render(); });
  document.querySelectorAll('[data-rm]').forEach((b) => b.onclick = () => { const [r, i] = b.dataset.rm.split('|'); W.roles[r].splice(+i, 1); markDirty(); render(); });
  document.querySelectorAll('[data-addsel]').forEach((s) => s.onchange = () => { if (s.value) { W.roles[s.dataset.addsel].push(s.value); markDirty(); render(); } });
  document.querySelectorAll('[data-en]').forEach((c) => c.onchange = () => { W.providers[c.dataset.en].enabled = c.checked; markDirty(); render(); });
  document.querySelectorAll('[data-pf]').forEach((i) => i.oninput = () => {
    const [n, k] = i.dataset.pf.split('|'), v = i.value.trim(), pr = W.providers[n];
    if (k === 'fallbackModels') { const l = v.split(',').map((x) => x.trim()).filter(Boolean); if (l.length) pr[k] = l; else delete pr[k]; }
    else if (k === 'timeoutMin') { if (Number(v) > 0) pr[k] = Number(v); else delete pr[k]; }
    else pr[k] = v;
    markDirty(); });
  document.querySelectorAll('[data-test]').forEach((b) => b.onclick = async () => {
    const n = b.dataset.test, out = document.getElementById('test-' + n);
    out.style.paddingBottom = '10px';
    b.disabled = true; out.textContent = 'Testing… (CLI agents can take a minute)';
    try { const r = await api('POST', '/api/test', { name: n, provider: W.providers[n] }); out.innerHTML = r.ok ? '<span class="pill ok">✓ responded</span>' : `<span class="pill bad">✗ ${esc(r.reason)}</span> ${esc(r.sample)}`; }
    catch (e) { out.textContent = '✗ ' + e.message; } finally { b.disabled = false; }
  });
  document.querySelectorAll('[data-del]').forEach((b) => b.onclick = () => { const n = b.dataset.del; delete W.providers[n]; for (const c of Object.values(W.roles)) { const i = c.indexOf(n); if (i >= 0) c.splice(i, 1); } markDirty(); render(); });
  const ra = $('#rt-add'); if (ra) ra.onclick = () => {
    const r = { role: $('#rt-role').value, files: $('#rt-files').value.trim(), text: $('#rt-text').value.trim(), provider: $('#rt-prov').value };
    if (!r.role && !r.files && !r.text) return toast('Fill in a role, files or text to match on');
    if (!r.provider) return toast('Enable a provider first');
    if (r.text) { try { new RegExp(r.text); } catch { return toast('Task text is not a valid regex'); } }
    for (const k of ['role', 'files', 'text']) if (!r[k]) delete r[k];
    (W.routes ||= []).push(r); markDirty(); render(); toast('Rule added. Save to keep it');
  };
  const addLib = async (ids) => {
    try { const d = await api('POST', '/api/route-templates', { providers: W.providers, routes: W.routes || [], add: ids });
      W.routes = d.routes; markDirty(); rtLibKey = ''; render();
      toast(d.added.length ? `Added ${d.added.length} rule${d.added.length > 1 ? 's' : ''}. Save to keep ${d.added.length > 1 ? 'them' : 'it'}` : d.skipped.map((x) => `${x.id}: ${x.why}`).join('; ') || 'Nothing to add');
    } catch (e) { toast(e.message); } };
  const ld = $('#rt-libd'); if (ld) ld.ontoggle = () => { rtLibOpen = ld.open; };
  const rs = $('#rt-starter'); if (rs) rs.onclick = () => addLib(rtLib.filter((t) => t.starter).map((t) => t.id));
  document.querySelectorAll('[data-rtlib]').forEach((b) => b.onclick = () => addLib([b.dataset.rtlib]));
  document.querySelectorAll('[data-rtedit]').forEach((b) => b.onclick = () => {
    const r = rtLib.find((t) => t.id === b.dataset.rtedit).route;
    $('#rt-role').value = r.role || ''; $('#rt-files').value = [].concat(r.files || []).join(', '); $('#rt-text').value = r.text || '';
    const p = [].concat(r.provider)[0]; if (p) $('#rt-prov').value = p;
    $('#rt-files').scrollIntoView({ block: 'center' }); toast('Copied into the form: change it, then Add rule');
  });
  document.querySelectorAll('[data-rtrm]').forEach((b) => b.onclick = () => { W.routes.splice(+b.dataset.rtrm, 1); markDirty(); render(); });
  document.querySelectorAll('[data-rtmv]').forEach((b) => b.onclick = () => { const [i, d] = b.dataset.rtmv.split('|').map(Number); const a = W.routes; [a[i], a[i + d]] = [a[i + d], a[i]]; markDirty(); render(); });
  document.querySelectorAll('[data-local]').forEach((b) => b.onclick = async () => {
    if (dirty) return toast('Save or discard your other changes first');
    const [id, model] = b.dataset.local.split('|');
    b.disabled = true;
    try { const r = await api('POST', '/api/providers/add', { id, model, scope: $('#scope').value }); load(r); localAt = 0; loadLocal(); toast(`${r.added.name} on with ${r.added.model}`); } catch (e) { toast(e.message); b.disabled = false; }
  });
  const pv = $('#pv-go'); if (pv) pv.onclick = async () => {
    const input = { role: $('#pv-role').value, task: $('#pv-task').value, files: $('#pv-files').value };
    try { rPreview = { ...(await api('POST', '/api/route-preview', { ...input, routes: W.routes || [], roles: W.roles })), input }; render(); } catch (e) { toast(e.message); }
  };
  document.querySelectorAll('[data-popen]').forEach((b) => b.onclick = () => { const n = b.dataset.popen; pOpen.has(n) ? pOpen.delete(n) : pOpen.add(n); render(); });
  document.querySelectorAll('[data-pall]').forEach((b) => b.onclick = () => { pAll = b.dataset.pall === '1'; render(); });
  const pa = $('#padd'); if (pa) pa.onclick = () => { pAdd = !pAdd; gOpen = null; render(); if (pAdd) $('#g-q')?.focus(); };
  // the search and the category chip combine; neither resets the other
  const gq = $('#g-q'); if (gq) gq.oninput = () => { gFilter.q = gq.value; applyGalleryFilter(); };
  document.querySelectorAll('[data-gcat]').forEach((b) => b.onclick = () => { gFilter.cat = b.dataset.gcat; applyGalleryFilter(); });
  document.querySelectorAll('[data-gadd]').forEach((b) => b.onclick = () => { gOpen = b.dataset.gadd; render(); });
  const gd = $('#g-dlg');
  if (gd) {
    if (!gd.open) gd.showModal();
    (gd.querySelector('#g-key') || gd.querySelector('[data-gfield]') || gd.querySelector('[data-gsave]')).focus();
    // Esc or Cancel; a re-render also removes the dialog, and then there is nothing to close
    gd.onclose = () => { if (gOpen && gd.isConnected) { gOpen = null; render(); } };
  }
  document.querySelectorAll('[data-gclose]').forEach((b) => b.onclick = () => { gOpen = null; render(); });
  document.querySelectorAll('[data-gsave]').forEach((b) => b.onclick = async () => {
    if (dirty) return toast('Save or discard your other changes first');
    const fields = {}; document.querySelectorAll('[data-gfield]').forEach((i) => { fields[i.dataset.gfield] = i.value.trim(); });
    b.disabled = true; b.textContent = 'Adding…';
    try {
      const r = await api('POST', '/api/providers/add', { id: b.dataset.gsave, key: $('#g-key')?.value.trim() || undefined, fields, scope: $('#scope').value });
      gOpen = null; load(r);
      toast(`${r.added.name} added${r.added.model ? ` (${r.added.model})` : ''}. ${r.added.warning || 'Use Test on its card.'}`);
    } catch (e) { toast(e.message); b.disabled = false; b.textContent = 'Add and enable'; }
  });
  document.querySelectorAll('[data-lm]').forEach((b) => b.onclick = async () => {
    b.disabled = true; b.textContent = 'Loading…';
    try { const r = await api('POST', '/api/provider-models', { name: b.dataset.lm }); if (r.error) toast(r.error); else { provModels[b.dataset.lm] = r.models; toast(`${r.models.length} models`); } } catch (e) { toast(e.message); }
    render();
  });
  const lf = $('#loadfree'); if (lf) lf.onclick = async () => { lf.disabled = true; lf.textContent = 'Loading…'; try { freeModels = (await api('GET', '/api/models')).models; toast(`${freeModels.length} free models`); } catch (e) { toast(e.message); } render(); };
  const add = $('#np-add'); if (add) add.onclick = () => {
    const name = $('#np-name').value.trim(), type = $('#np-type').value, base = $('#np-base').value.trim();
    if (!/^[a-z0-9][a-z0-9-]*$/.test(name)) return toast('Name: lowercase letters, digits and dashes');
    if (W.providers[name]) return toast('That name exists');
    W.providers[name] = type === 'cli' ? { type, preset: base || 'opencode', enabled: true, model: $('#np-model').value.trim() }
      : { type, enabled: true, baseUrl: base, apiKeyEnv: $('#np-key').value.trim(), model: $('#np-model').value.trim() };
    markDirty(); render(); toast('Added. Put it in a role chain, then Save');
  };
  document.querySelectorAll('[data-savekey]').forEach((b) => b.onclick = async () => {
    const k = b.dataset.savekey, v = document.querySelector(`[data-key="${k}"]`).value.trim(); if (!v) return toast('Paste a key first');
    try { load(await api('PUT', '/api/secrets', { updates: { [k]: v } })); toast(`${k} saved`); } catch (e) { toast(e.message); }
  });
  document.querySelectorAll('[data-delkey]').forEach((b) => b.onclick = async () => { try { load(await api('PUT', '/api/secrets', { updates: { [b.dataset.delkey]: null } })); toast('Removed'); } catch (e) { toast(e.message); } });
  document.querySelectorAll('input[name=ctrl]').forEach((r) => r.onchange = () => { ctrlPick = r.value; render(); });
  const ap = $('#apply-ctrl'); if (ap) ap.onclick = async () => {
    ap.disabled = true;
    try {
      const r = await api('POST', '/api/init', { controller: ctrlPick || S.effective.controller, mcp: $('#ctrl-mcp').checked });
      const out = r.lines.join('\n') + (r.notes.length ? '\n\n' + r.notes.join('\n') : '');
      S = r.state; W.controller = S.effective.controller; ctrlPick = null; render();
      const pre = $('#init-out'); pre.style.display = 'block'; pre.textContent = out; toast('Project updated');
    } catch (e) { toast(e.message); ap.disabled = false; }
  };
  document.querySelectorAll('[data-step]').forEach((b) => b.onclick = () => {
    const i = b.parentElement.querySelector('input'), v = Number(i.value || 0) + Number(b.dataset.step) * Number(i.dataset.inc || 1);
    i.value = Math.max(0, Math.round(v * 100) / 100); i.dispatchEvent(new Event('input'));
  });
  document.querySelectorAll('[data-set]').forEach((i) => i.oninput = () => { const f = Number(i.dataset.factor || 1); W.settings[i.dataset.set] = f === 1 ? Number(i.value) : Math.round(Number(i.value) * f); markDirty(); });
  document.querySelectorAll('[data-sets]').forEach((i) => i.oninput = () => { W.settings[i.dataset.sets] = i.value; markDirty(); });
  document.querySelectorAll('[data-setl]').forEach((i) => i.oninput = () => { W.settings[i.dataset.setl] = i.value.split(',').map((x) => x.trim()).filter(Boolean); markDirty(); });
  document.querySelectorAll('[data-setb]').forEach((i) => i.onchange = () => { W.settings[i.dataset.setb] = i.checked; markDirty(); });
}

(async () => {
  try { const sc = localStorage.getItem('conductor-scope'); if (sc) $('#scope').value = sc; } catch {}
  if (!TOKEN) { $('#main').innerHTML = '<div class="err">Missing access token. Open the full URL printed by <span class="mono">conductor-ai ui</span>.</div>'; return; }
  try { const st = await api('GET', '/api/state'); if (!st.hasProjectConfig && !localStorage.getItem('conductor-scope')) $('#scope').value = 'global'; load(st); }
  catch (e) { $('#main').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
})();
window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
</script>
</body>
</html>
