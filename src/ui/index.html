<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conductor Settings</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f1f3f6; --text: #16181d; --muted: #5d6573; --line: #e2e5ea;
  --accent: #4f46e5; --accent-ink: #ffffff; --accent-soft: #eef0ff;
  --ok: #15803d; --ok-soft: #e7f6ec; --bad: #b42318; --bad-soft: #fdecea; --warn: #a15c07; --warn-soft: #fdf3e2;
  --local: #0e7490; --local-soft: #e3f5f8; --cloud: #7c3aed; --cloud-soft: #f1ebfe;
  --radius: 10px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --text: #e7e9ee; --muted: #9aa3b2; --line: #2a2f3a;
    --accent: #818cf8; --accent-ink: #0f1115; --accent-soft: #23264a;
    --ok: #4ade80; --ok-soft: #12291b; --bad: #f87171; --bad-soft: #2d1515; --warn: #fbbf24; --warn-soft: #2b2110;
    --local: #22d3ee; --local-soft: #0c2a30; --cloud: #c4b5fd; --cloud-soft: #241a3d; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --text: #e7e9ee; --muted: #9aa3b2; --line: #2a2f3a;
  --accent: #818cf8; --accent-ink: #0f1115; --accent-soft: #23264a;
  --ok: #4ade80; --ok-soft: #12291b; --bad: #f87171; --bad-soft: #2d1515; --warn: #fbbf24; --warn-soft: #2b2110;
  --local: #22d3ee; --local-soft: #0c2a30; --cloud: #c4b5fd; --cloud-soft: #241a3d; --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
a { color: var(--accent); }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 12px; padding: 10px 20px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 16px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.brand svg { color: var(--accent); }
.proj { color: var(--muted); font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46ch; }
.spacer { flex: 1; }
.layout { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 0; max-width: 1200px; margin: 0 auto; }
nav { padding: 16px 12px; position: sticky; top: 57px; align-self: start; }
nav button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--muted); padding: 8px 12px; border-radius: 8px; font: inherit; cursor: pointer; }
nav button:hover { background: var(--panel-2); color: var(--text); }
nav button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
main { padding: 20px; min-width: 0; }
h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.01em; }
h2 { font-size: 15px; margin: 0 0 10px; }
.sub { color: var(--muted); margin: 0 0 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.stat .n { font-size: 26px; font-weight: 700; }
.stat .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 6px 12px; border-radius: 8px; font: inherit; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.small { padding: 3px 8px; font-size: 12px; }
.btn.icon { padding: 3px 7px; }
.btn:disabled { opacity: .45; cursor: default; }
input[type=text], input[type=password], input[type=number], select, textarea { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font: inherit; width: 100%; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
label.f { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 1px 8px; border-radius: 99px; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.local-agent, .pill.local-model { background: var(--local-soft); color: var(--local); } .pill.cloud-api { background: var(--cloud-soft); color: var(--cloud); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); flex: none; } .dot.ok { background: var(--ok); }
.chain { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; }
.link { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); }
.link .idx { color: var(--muted); font-size: 12px; text-align: center; }
.link .nm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
.chainline { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chainline .arrow { color: var(--muted); }
.prov { display: grid; grid-template-columns: auto 1fr; gap: 12px; }
.prov-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.prov-head b { font-size: 14.5px; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-top: 10px; }
.note { color: var(--muted); font-size: 12.5px; }
.switch { position: relative; width: 34px; height: 20px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 99px; cursor: pointer; transition: .15s; }
.switch span::after { content: ""; position: absolute; width: 14px; height: 14px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
.switch input:checked + span { background: var(--accent); } .switch input:checked + span::after { transform: translateX(14px); }
.ctrl { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.ctrl label { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; cursor: pointer; background: var(--panel); display: block; }
.ctrl input { margin-right: 6px; } .ctrl label.sel { border-color: var(--accent); background: var(--accent-soft); }
pre.cmd { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 6px 0; overflow-x: auto; font-family: var(--mono); font-size: 12.5px; position: relative; white-space: pre-wrap; word-break: break-all; }
.copy { position: absolute; top: 5px; right: 5px; }
table { width: 100%; border-collapse: collapse; }
td, th { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
.savebar { position: sticky; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 10px 20px; display: none; align-items: center; gap: 10px; flex-wrap: wrap; z-index: 5; }
.savebar.show { display: flex; }
#toast { position: fixed; right: 16px; bottom: 70px; background: var(--text); color: var(--bg); padding: 9px 14px; border-radius: 8px; opacity: 0; transition: .2s; pointer-events: none; max-width: 80vw; z-index: 10; }
#toast.show { opacity: 1; }
.err { background: var(--bad-soft); color: var(--bad); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; }
.steps { counter-reset: s; list-style: none; padding: 0; margin: 0; }
.steps > li { counter-increment: s; position: relative; padding-left: 36px; margin-bottom: 16px; }
.steps > li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; display: grid; place-items: center; font-size: 12px; }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  nav { position: static; display: flex; overflow-x: auto; gap: 4px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  nav button { width: auto; white-space: nowrap; }
  main { padding: 16px; }
  .bar { padding: 10px 16px; }
  .proj { max-width: 100%; order: 5; flex-basis: 100%; }
  table { display: block; overflow-x: auto; }
  td input[type=password] { min-width: 140px; }
}
.sub .mono, td.mono { word-break: break-all; }
body { overflow-x: hidden; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20 L14 6"/><circle cx="16" cy="4.5" r="2"/><path d="M3 12h3M18 12h3M12 18v3"/></svg>
      conductor
    </div>
    <span class="proj" id="proj"></span>
    <span class="spacer"></span>
    <label class="note" for="scope">Save to</label>
    <select id="scope" style="width:auto">
      <option value="global">Global (all projects)</option>
      <option value="project">This project only</option>
    </select>
    <button class="btn icon" id="theme" title="Toggle theme" aria-label="Toggle theme">◐</button>
  </div>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"><p class="note">Loading…</p></main>
</div>
<div class="savebar" id="savebar">
  <b>Unsaved changes</b><span class="note" id="savewhere"></span><span class="spacer"></span>
  <button class="btn" id="discard">Discard</button>
  <button class="btn primary" id="save">Save</button>
</div>
<div id="toast" role="status"></div>
<script>
const TOKEN = new URLSearchParams(location.hash.slice(1)).get('t') || '';
const TABS = [['overview', 'Overview'], ['roles', 'Roles & fallback'], ['providers', 'Providers'], ['keys', 'API keys'], ['controller', 'Controller'], ['settings', 'Settings'], ['setup', 'Install & setup']];
let S = null, W = null, tab = 'overview', dirty = false, freeModels = null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = (x) => JSON.parse(JSON.stringify(x));

try { const t = localStorage.getItem('conductor-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
$('#theme').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('conductor-theme', next); } catch {}
};

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { 'content-type': 'application/json', 'x-conductor-token': TOKEN }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }
function markDirty() { dirty = true; $('#savebar').classList.add('show'); $('#savewhere').textContent = ' → ' + ($('#scope').value === 'global' ? 'global config (all projects)' : 'this project'); }
function load(state) { S = state; W = clone(S.effective); dirty = false; $('#savebar').classList.remove('show'); $('#proj').textContent = S.root; render(); }

$('#save').onclick = async () => {
  try { load(await api('PUT', '/api/config', { scope: $('#scope').value, effective: W })); toast('Saved'); }
  catch (e) { toast('Not saved: ' + e.message); }
};
$('#discard').onclick = () => load(S);
$('#scope').onchange = () => { if (dirty) markDirty(); try { localStorage.setItem('conductor-scope', $('#scope').value); } catch {} };

function renderNav() {
  $('#nav').innerHTML = TABS.map(([k, l]) => `<button data-tab="${k}" class="${k === tab ? 'active' : ''}">${l}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach((b) => b.onclick = () => { tab = b.dataset.tab; render(); });
}
function provStatus(name) { return S.status.providers.find((p) => p.name === name) || { ready: false, reason: 'unknown' }; }
function locPill(p) { const l = p.location || 'cloud-api'; return `<span class="pill ${l}">${{ 'local-agent': 'local agent', 'local-model': 'local model', 'cloud-api': 'cloud API' }[l]}</span>`; }
function readyPill(name) { const st = provStatus(name); const w = W.providers[name]; if (w && !w.enabled) return '<span class="pill">disabled</span>'; return st.ready ? '<span class="pill ok">ready</span>' : `<span class="pill bad">${esc(st.reason)}</span>`; }
function copyBtn(text) { return `<button class="btn small copy" data-copy="${esc(text)}">copy</button>`; }
function cmd(text) { return `<pre class="cmd">${esc(text)}${copyBtn(text)}</pre>`; }
function bindCopy() { document.querySelectorAll('[data-copy]').forEach((b) => b.onclick = () => { navigator.clipboard?.writeText(b.dataset.copy).then(() => toast('Copied'), () => toast('Copy failed')); }); }

const views = {
  overview() {
    const st = S.status; const ready = st.providers.filter((p) => p.ready).length; const enabled = st.providers.filter((p) => p.enabled).length;
    const cds = Object.entries(S.cooldowns);
    return `<h1>Overview</h1><p class="sub">${esc(S.controllers[W.controller]?.label || W.controller)} is the controller. It plans and reviews, and hands work to the providers below in fallback order.</p>
    ${S.errors.length ? `<div class="err">Config problems: ${S.errors.map(esc).join('; ')}</div>` : ''}
    <div class="grid">
      <div class="card stat"><div class="l">Controller</div><div class="n" style="font-size:18px">${esc(S.controllers[W.controller]?.label || W.controller)}</div><div class="note">Change in Controller</div></div>
      <div class="card stat"><div class="l">Providers ready</div><div class="n">${ready}<span class="note" style="font-size:14px"> / ${enabled} enabled</span></div></div>
      <div class="card stat"><div class="l">Repo</div><div class="n" style="font-size:16px">${st.repo ? esc(st.repo.branch) : 'not a git repo'}</div><div class="note">${st.repo ? (st.repo.dirty ? 'uncommitted changes' : 'clean') + (st.repo.failedStashes ? ` · ${st.repo.failedStashes} failed-attempt stash(es)` : '') : 'write roles need git'}</div></div>
      <div class="card stat"><div class="l">Verify command</div><div class="mono" style="margin-top:6px">${esc(st.verify || 'none detected')}</div></div>
    </div>
    <div class="card"><h2>Who does what</h2>
      <table><tr><th>Role</th><th>Fallback chain</th></tr>
      ${Object.entries(W.roles).map(([r, chain]) => `<tr><td><b>${esc(S.roles[r]?.label || r)}</b> ${S.roles[r]?.mode === 'read' ? '<span class="pill">read-only</span>' : ''}</td><td><div class="chainline">${chain.map((n, i) => `${i ? '<span class="arrow">→</span>' : ''}<span class="pill"><span class="dot ${provStatus(n).ready && W.providers[n]?.enabled ? 'ok' : ''}"></span>${esc(n)}</span>`).join('')}</div></td></tr>`).join('')}
      </table></div>
    ${cds.length ? `<div class="card"><h2>Cooling down (rate-limited)</h2>${cds.map(([n, c]) => `<div class="row" style="margin-bottom:6px"><b>${esc(n)}</b><span class="note">until ${new Date(c.until).toLocaleTimeString()}</span><button class="btn small" data-clear="${esc(n)}">clear</button></div>`).join('')}</div>` : ''}
    ${!S.hasProjectConfig && S.inRepo ? `<div class="card"><h2>This project isn't set up yet</h2><p class="note">Add the rules file, controller commands and plan template to <span class="mono">${esc(S.root)}</span>.</p><button class="btn primary" data-goto="controller">Set up this project</button></div>` : ''}`;
  },
  roles() {
    const names = Object.keys(W.providers);
    return `<h1>Roles & fallback</h1><p class="sub">Each role tries providers top to bottom. If one is rate-limited, fails or isn't installed, the next one runs. If all fail, the controller does the task itself.</p>
    ${Object.entries(W.roles).map(([r, chain]) => `<div class="card"><div class="row"><h2 style="margin:0">${esc(S.roles[r]?.label || r)}</h2>${S.roles[r]?.mode === 'read' ? '<span class="pill">read-only</span>' : '<span class="pill warn">edits files</span>'}</div>
      <div class="note">${esc(S.roles[r]?.description || '')}</div>
      <div class="chain">${chain.map((n, i) => `<div class="link"><span class="idx">${i + 1}</span><span class="nm"><b>${esc(n)}</b>${W.providers[n] ? locPill(provStatus(n)) : ''}${readyPill(n)}</span>
        <span class="row"><button class="btn icon small" data-mv="${r}|${i}|-1" ${i === 0 ? 'disabled' : ''} aria-label="Move up">↑</button><button class="btn icon small" data-mv="${r}|${i}|1" ${i === chain.length - 1 ? 'disabled' : ''} aria-label="Move down">↓</button><button class="btn icon small" data-rm="${r}|${i}" aria-label="Remove">✕</button></span></div>`).join('') || '<div class="note">No providers: the controller will do this role itself.</div>'}</div>
      <div class="row"><select data-addsel="${r}" style="max-width:260px"><option value="">+ add provider…</option>${names.filter((n) => !chain.includes(n)).map((n) => `<option>${esc(n)}</option>`).join('')}</select></div></div>`).join('')}`;
  },
  providers() {
    const groups = { 'local-agent': 'Local agents (CLI tools that use your logins)', 'cloud-api': 'Cloud APIs (remote models: Gemini, OpenRouter, Kimi, Claude…)', 'local-model': 'Local models (Ollama, LM Studio)' };
    const byLoc = {};
    for (const [n, p] of Object.entries(W.providers)) { const loc = provStatus(n).location || (p.type === 'cli' ? 'local-agent' : 'cloud-api'); (byLoc[loc] ||= []).push(n); }
    const field = (n, k, label, ph = '', list = '') => `<div><label class="f">${label}</label><input type="text" data-pf="${esc(n)}|${k}" value="${esc(W.providers[n][k] || '')}" placeholder="${esc(ph)}" ${list ? `list="${list}"` : ''}></div>`;
    const card = (n) => { const p = W.providers[n]; const builtin = S.builtinProviders.includes(n);
      return `<div class="card prov"><label class="switch" title="Enable"><input type="checkbox" data-en="${esc(n)}" ${p.enabled ? 'checked' : ''}><span></span></label><div>
        <div class="prov-head"><b>${esc(n)}</b>${locPill(provStatus(n))}${readyPill(n)}<span class="pill">${p.type === 'cli' ? esc(S.presets[p.preset]?.label || p.bin || 'cli') : p.type === 'anthropic' ? 'Anthropic API' : 'OpenAI-compatible'}</span>
          <span class="spacer"></span><button class="btn small" data-test="${esc(n)}">Test</button>${builtin ? '' : `<button class="btn small" data-del="${esc(n)}">Remove</button>`}</div>
        ${p.notes ? `<div class="note">${esc(p.notes)}</div>` : ''}
        <div class="fields">${field(n, 'model', 'Model', p.type === 'cli' ? 'CLI default' : 'required', n.startsWith('openrouter') ? 'dl-or' : (p.preset === 'opencode' ? 'dl-oc' : ''))}
          ${p.type !== 'cli' ? field(n, 'baseUrl', 'Base URL') + field(n, 'apiKeyEnv', 'API key env var', 'none for local') : ''}</div>
        ${n.startsWith('openrouter') ? `<div class="row" style="margin-top:8px"><button class="btn small" id="loadfree">Load current free models</button><span class="note">${freeModels ? freeModels.length + ' free models loaded into the dropdown' : 'The free list changes often'}</span></div>` : ''}
        <div class="note" id="test-${esc(n)}"></div></div></div>`; };
    return `<h1>Providers</h1><p class="sub">Turn providers on or off and pick models. Keys go in API keys and are never saved in config files.</p>
      <datalist id="dl-oc">${['opencode/big-pickle', 'opencode/glm-5.3-flash-free', 'opencode/deepseek-v4.1-flash-free', 'opencode/nemotron-3-ultra-free', 'opencode/mimo-v2.6-flash-free'].map((m) => `<option value="${m}">`).join('')}</datalist>
      <datalist id="dl-or"><option value="openrouter/free">${(freeModels || []).map((m) => `<option value="${esc(m.id)}">${m.tools ? 'tools · ' : ''}${m.context || ''}</option>`).join('')}</datalist>
      ${Object.entries(groups).map(([loc, title]) => byLoc[loc]?.length ? `<h2 style="margin-top:18px">${title}</h2>${byLoc[loc].map(card).join('')}` : '').join('')}
      <div class="card"><h2>Add a custom provider</h2><p class="note">Any OpenAI-compatible endpoint (Together, Fireworks, Mistral, a company gateway…), or another CLI agent.</p>
        <div class="fields"><div><label class="f">Name</label><input type="text" id="np-name" placeholder="e.g. mistral-api"></div>
        <div><label class="f">Type</label><select id="np-type"><option value="openai">OpenAI-compatible API</option><option value="anthropic">Anthropic API</option><option value="cli">CLI agent</option></select></div>
        <div><label class="f">Base URL / CLI preset</label><input type="text" id="np-base" placeholder="https://api.example.com/v1  or  gemini|codex|opencode|kimi|claude"></div>
        <div><label class="f">API key env var</label><input type="text" id="np-key" placeholder="EXAMPLE_API_KEY"></div>
        <div><label class="f">Model</label><input type="text" id="np-model"></div></div>
        <div class="row" style="margin-top:10px"><button class="btn" id="np-add">Add provider</button></div></div>`;
  },
  keys() {
    return `<h1>API keys</h1><p class="sub">Stored in <span class="mono">${esc(S.paths.secrets)}</span> (readable only by you), never in config files or git. Real environment variables take priority. In cloud or CI environments, set these as environment secrets instead.</p>
    <div class="card"><table><tr><th>Variable</th><th>Status</th><th>Used by</th><th style="width:38%">Set / replace</th></tr>
    ${S.secrets.map((k) => `<tr><td class="mono">${esc(k.name)}</td><td>${k.set ? `<span class="pill ok">set ${esc(k.hint)}</span> <span class="note">${esc(k.source)}</span>` : '<span class="pill bad">not set</span>'}</td><td class="note">${esc(k.usedBy.join(', ') || '-')}</td>
      <td><div class="row" style="flex-wrap:nowrap"><input type="password" data-key="${esc(k.name)}" placeholder="paste key" autocomplete="off"><button class="btn small" data-savekey="${esc(k.name)}">Save</button>${k.source === 'secrets file' ? `<button class="btn small" data-delkey="${esc(k.name)}">Remove</button>` : ''}</div></td></tr>`).join('')}
    </table></div>
    <div class="card"><h2>Where to get free keys</h2><ul>
      <li><b>Gemini API</b> (free tier): <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a></li>
      <li><b>OpenRouter</b> (<span class="mono">:free</span> models, 50 req/day, or 1000/day after a one-time $10 credit): <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">openrouter.ai/keys</a></li>
      <li><b>Kimi / Moonshot</b>: <a href="https://platform.moonshot.ai" target="_blank" rel="noopener">platform.moonshot.ai</a></li>
      <li><b>Groq</b>: <a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a></li></ul></div>`;
  },
  controller() {
    return `<h1>Controller</h1><p class="sub">The controller plans, delegates, reviews and commits. Claude Code is the default because it reviews best, but you can pick any agent. Applying writes that agent's instruction file, its <span class="mono">/conduct-*</span> commands and the MCP entry into this project, without overwriting your own content.</p>
    <div class="card"><div class="ctrl">${Object.entries(S.controllers).map(([k, c]) => `<label class="${W.controller === k ? 'sel' : ''}"><input type="radio" name="ctrl" value="${k}" ${W.controller === k ? 'checked' : ''}><b>${esc(c.label)}</b><div class="note">instructions in ${esc(c.file)}</div></label>`).join('')}</div>
      <div class="row" style="margin-top:14px"><button class="btn primary" id="apply-ctrl" ${S.inRepo ? '' : 'disabled'}>Apply to this project</button><label class="row note"><input type="checkbox" id="ctrl-mcp" checked> also register the MCP server</label></div>
      ${S.inRepo ? '' : '<p class="note">Open the UI from inside a git project (<span class="mono">cd my-app && conductor ui</span>) to apply.</p>'}
      <pre class="cmd" id="init-out" style="display:none"></pre></div>`;
  },
  settings() {
    const st = W.settings; const num = (k, l, h) => `<div><label class="f">${l}</label><input type="number" data-set="${k}" value="${esc(st[k])}"><div class="note">${h}</div></div>`;
    const chk = (k, l) => `<label class="row"><input type="checkbox" data-setb="${k}" ${st[k] ? 'checked' : ''}> ${l}</label>`;
    return `<h1>Settings</h1><p class="sub">Defaults suit most projects.</p><div class="card"><div class="fields">
      ${num('timeoutSec', 'Timeout per attempt (seconds)', 'A worker is stopped and the next one tried')}
      ${num('cooldownMinutes', 'Cooldown after rate limit (minutes)', "Rate-limited providers are skipped this long (or for the provider's Retry-After)")}
      ${num('maxDiffBytes', 'Max review diff (bytes)', 'Larger diffs are truncated')}
      ${num('maxContextBytes', 'Max context for API models (bytes)', 'File content sent to chat-only providers')}
      <div><label class="f">Verify command</label><input type="text" data-sets="verify" value="${esc(st.verify)}" placeholder="auto: AGENTS.md Verify line, then npm/pytest/cargo/go"><div class="note">Must pass before a task counts as done</div></div>
      <div><label class="f">Protected branches</label><input type="text" data-setl="protectedBranches" value="${esc((st.protectedBranches || []).join(', '))}"><div class="note">Workers never write on these</div></div>
      </div><div style="margin-top:12px;display:grid;gap:6px">${chk('requireCleanTree', 'Require a clean git tree before write roles (enables safe stash-on-failure)')}${chk('autoVerify', 'Run verify automatically after each write task')}</div></div>`;
  },
  setup() {
    const p = S.presets;
    return `<h1>Install & setup</h1><p class="sub">Works for every project: install conductor once, then run <span class="mono">conductor init</span> in each project.</p>
    <div class="card"><h2>Status on this machine</h2><table><tr><th>Tool</th><th>Status</th><th>Install</th><th>Sign in</th></tr>
      <tr><td>Node.js</td><td><span class="pill ok">${esc(S.env.node)}</span></td><td class="note">20+ required</td><td></td></tr>
      <tr><td>conductor on PATH</td><td>${S.env.conductorOnPath ? '<span class="pill ok">yes</span>' : '<span class="pill bad">no</span>'}</td><td class="mono">npm install -g github:&lt;you&gt;/conductor-ai</td><td></td></tr>
      ${Object.entries(p).map(([k, v]) => `<tr><td>${esc(v.label)}</td><td>${v.installed ? '<span class="pill ok">installed</span>' : '<span class="pill bad">missing</span>'}</td><td class="mono" style="word-break:break-all">${esc(v.install)}</td><td class="mono">${esc(v.login)}</td></tr>`).join('')}
    </table></div>
    <div class="card"><h2>Steps</h2><ol class="steps">
      <li><b>Install conductor</b> (once per machine)${cmd('npm install -g github:<your-user>/conductor-ai\nconductor setup')}</li>
      <li><b>Install and sign in to your workers</b>: at least the ones enabled in Providers. Daily drivers:${cmd(p.gemini.install)}${cmd(p.codex.install)}<span class="note">Free models for tests and docs: OpenCode, or an OpenRouter key.</span></li>
      <li><b>Add keys</b> for cloud APIs on the API keys page (Gemini API, OpenRouter, Kimi…).</li>
      <li><b>Set up each project</b>${cmd('cd my-project\nconductor init            # or: conductor init --controller gemini-cli')}<span class="note">Then fill in section 1 of AGENTS.md (stack and Verify command).</span></li>
      <li><b>Check everything</b>${cmd('conductor doctor --live')}</li>
      <li><b>Use it from your controller</b>: in Claude Code: <span class="mono">/conduct-plan add password reset</span>, then <span class="mono">/conduct-run docs/plan/password-reset.md</span></li>
    </ol></div>
    <div class="card"><h2>Local vs cloud</h2><p class="note"><b>Local agents</b> (Gemini CLI, Codex CLI, OpenCode, Kimi CLI) run on your machine with your subscriptions and can edit files and run tests. <b>Cloud APIs</b> (Gemini API, OpenRouter, Kimi API, Claude API…) work anywhere with a key, including CI and Claude Code on the web. They return code, which conductor applies. <b>Local models</b> (Ollama, LM Studio) are free and private. Mix them freely in any role's chain.</p></div>`;
  },
};

function render() {
  renderNav();
  $('#main').innerHTML = views[tab]();
  bindCopy(); bind();
}

function bind() {
  document.querySelectorAll('[data-goto]').forEach((b) => b.onclick = () => { tab = b.dataset.goto; render(); });
  document.querySelectorAll('[data-clear]').forEach((b) => b.onclick = async () => { load(await api('POST', '/api/cooldowns/clear', { name: b.dataset.clear })); toast('Cooldown cleared'); });
  document.querySelectorAll('[data-mv]').forEach((b) => b.onclick = () => { const [r, i, d] = b.dataset.mv.split('|'); const c = W.roles[r]; const j = +i + +d; [c[i], c[j]] = [c[j], c[i]]; markDirty(); render(); });
  document.querySelectorAll('[data-rm]').forEach((b) => b.onclick = () => { const [r, i] = b.dataset.rm.split('|'); W.roles[r].splice(+i, 1); markDirty(); render(); });
  document.querySelectorAll('[data-addsel]').forEach((s) => s.onchange = () => { if (s.value) { W.roles[s.dataset.addsel].push(s.value); markDirty(); render(); } });
  document.querySelectorAll('[data-en]').forEach((c) => c.onchange = () => { W.providers[c.dataset.en].enabled = c.checked; markDirty(); render(); });
  document.querySelectorAll('[data-pf]').forEach((i) => i.oninput = () => { const [n, k] = i.dataset.pf.split('|'); W.providers[n][k] = i.value.trim(); markDirty(); });
  document.querySelectorAll('[data-test]').forEach((b) => b.onclick = async () => {
    const n = b.dataset.test, out = document.getElementById('test-' + n);
    b.disabled = true; out.textContent = 'Testing… (CLI agents can take a minute)';
    try { const r = await api('POST', '/api/test', { name: n, provider: W.providers[n] }); out.innerHTML = r.ok ? '<span class="pill ok">✓ responded</span>' : `<span class="pill bad">✗ ${esc(r.reason)}</span> ${esc(r.sample)}`; }
    catch (e) { out.textContent = '✗ ' + e.message; } finally { b.disabled = false; }
  });
  document.querySelectorAll('[data-del]').forEach((b) => b.onclick = () => { const n = b.dataset.del; delete W.providers[n]; for (const c of Object.values(W.roles)) { const i = c.indexOf(n); if (i >= 0) c.splice(i, 1); } markDirty(); render(); });
  const lf = $('#loadfree'); if (lf) lf.onclick = async () => { lf.disabled = true; lf.textContent = 'Loading…'; try { freeModels = (await api('GET', '/api/models')).models; toast(`${freeModels.length} free models`); } catch (e) { toast(e.message); } render(); };
  const add = $('#np-add'); if (add) add.onclick = () => {
    const name = $('#np-name').value.trim(), type = $('#np-type').value, base = $('#np-base').value.trim();
    if (!/^[a-z0-9][a-z0-9-]*$/.test(name)) return toast('Name: lowercase letters, digits and dashes');
    if (W.providers[name]) return toast('That name exists');
    W.providers[name] = type === 'cli' ? { type, preset: base || 'opencode', enabled: true, model: $('#np-model').value.trim() }
      : { type, enabled: true, baseUrl: base, apiKeyEnv: $('#np-key').value.trim(), model: $('#np-model').value.trim() };
    markDirty(); render(); toast('Added. Put it in a role chain, then Save');
  };
  document.querySelectorAll('[data-savekey]').forEach((b) => b.onclick = async () => {
    const k = b.dataset.savekey, v = document.querySelector(`[data-key="${k}"]`).value.trim(); if (!v) return toast('Paste a key first');
    try { load(await api('PUT', '/api/secrets', { updates: { [k]: v } })); toast(`${k} saved`); } catch (e) { toast(e.message); }
  });
  document.querySelectorAll('[data-delkey]').forEach((b) => b.onclick = async () => { try { load(await api('PUT', '/api/secrets', { updates: { [b.dataset.delkey]: null } })); toast('Removed'); } catch (e) { toast(e.message); } });
  document.querySelectorAll('input[name=ctrl]').forEach((r) => r.onchange = () => { W.controller = r.value; markDirty(); render(); });
  const ap = $('#apply-ctrl'); if (ap) ap.onclick = async () => {
    ap.disabled = true;
    try {
      const r = await api('POST', '/api/init', { controller: W.controller, mcp: $('#ctrl-mcp').checked });
      const out = r.lines.join('\n') + (r.notes.length ? '\n\n' + r.notes.join('\n') : '');
      S = r.state; W.controller = S.effective.controller; render();
      const pre = $('#init-out'); pre.style.display = 'block'; pre.textContent = out; toast('Project updated');
    } catch (e) { toast(e.message); ap.disabled = false; }
  };
  document.querySelectorAll('[data-set]').forEach((i) => i.oninput = () => { W.settings[i.dataset.set] = Number(i.value); markDirty(); });
  document.querySelectorAll('[data-sets]').forEach((i) => i.oninput = () => { W.settings[i.dataset.sets] = i.value; markDirty(); });
  document.querySelectorAll('[data-setl]').forEach((i) => i.oninput = () => { W.settings[i.dataset.setl] = i.value.split(',').map((x) => x.trim()).filter(Boolean); markDirty(); });
  document.querySelectorAll('[data-setb]').forEach((i) => i.onchange = () => { W.settings[i.dataset.setb] = i.checked; markDirty(); });
}

(async () => {
  try { const sc = localStorage.getItem('conductor-scope'); if (sc) $('#scope').value = sc; } catch {}
  if (!TOKEN) { $('#main').innerHTML = '<div class="err">Missing access token. Open the full URL printed by <span class="mono">conductor ui</span>.</div>'; return; }
  try { const st = await api('GET', '/api/state'); if (!st.hasProjectConfig && !localStorage.getItem('conductor-scope')) $('#scope').value = 'global'; load(st); }
  catch (e) { $('#main').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
})();
window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
</script>
</body>
</html>
