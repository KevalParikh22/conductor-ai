<style>
:root {

}

    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --text: #e7e9ee; --muted: #9aa3b2; --line: #2a2f3a;

:root[data-theme="dark"] {

  --accent: #818cf8; --accent-ink: #0f1115; --accent-soft: #23264a;
  --ok: #4ade80; --ok-soft: #12291b; --bad: #f87171; --bad-soft: #2d1515; --warn: #fbbf24; --warn-soft: #2b2110;

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

.brand svg { color: var(--accent); }

.layout { display: grid; grid-template-columns: 184px minmax(0, 1fr); gap: 0; max-width: 1200px; margin: 0 auto; }

.stat .n { font-size: 26px; font-weight: 700; }

.btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 6px 12px; border-radius: 8px; font: inherit; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--panel-2); }

.btn.icon { padding: 3px 7px; }

.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.mini { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--panel-2); }
.mini .note { display: block; margin-top: 6px; }
input[type=text], input[type=search], input[type=password], input[type=number], select, textarea { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font: inherit; width: 100%; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
label.f { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.chain { display: flex; flex-direction: column; gap: 4px; margin: 10px 0; }
.link { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: center; padding: 4px 6px 4px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); }
.link .idx { color: var(--muted); font-size: 12px; text-align: center; }

.gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; margin-top: 12px; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }

svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
.btn svg.i { width: 14px; height: 14px; }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); } .btn.ghost:hover { background: var(--panel-2); color: var(--text); }
.head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; } .head h1 { margin: 0; } .head .sub { margin: 2px 0 0; flex-basis: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; } .seg button { border: 0; background: var(--panel); color: var(--muted); padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; } .seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.plist { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 14px; }
.prow { border-bottom: 1px solid var(--line); } .prow:last-child { border-bottom: 0; }
.prow-main { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 14px; }
.prow-name { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; } .prow-name b { font-size: 14px; }
.prow-model { color: var(--muted); font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 28ch; }
.prow-body { padding: 0 14px 14px 60px; } .prow.open { background: var(--panel-2); }
.chev { transition: transform .15s; } .prow.open .chev { transform: rotate(180deg); }
.kind { color: var(--muted); display: inline-flex; } .kind svg.i { width: 14px; height: 14px; }
.roles { display: grid; gap: 14px; } .roles .card { margin: 0; max-width: 760px; }
.trend { display: flex; gap: 10px; align-items: flex-end; } .tw { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 40px; font-size: 12.5px; }
.tbar { height: 70px; width: 22px; background: var(--panel-2); border-radius: 4px; display: flex; align-items: flex-end; overflow: hidden; }
.tbar span { display: block; width: 100%; background: var(--muted); } .tbar span.ok { background: var(--ok); } .tbar span.low { background: var(--warn); }
.rtabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.rtab { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; }
.rtab .note { font-size: 11.5px; } .rtab.on { border-color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); } .status.bad { color: var(--bad); }
details.more > summary { cursor: pointer; color: var(--muted); font-size: 13px; list-style: none; display: flex; align-items: center; gap: 6px; } details.more > summary::-webkit-details-marker { display: none; }
details.more[open] > summary { margin-bottom: 10px; }
.prov { display: grid; grid-template-columns: auto 1fr; gap: 12px; }
.prov-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.prov-head b { font-size: 14.5px; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-top: 10px; }
.note { color: var(--muted); font-size: 12.5px; }
.explain { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--panel-2); font-size: 13px; line-height: 1.5; }
.explain ol { margin: 4px 0 0; padding-left: 20px; } .explain li { margin: 2px 0; }
.lib { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); } .lib .item { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; overflow-wrap: anywhere; }
.lib .item .row { gap: 6px; } .lib .item .note { display: block; margin-top: 2px; }
.switch { position: relative; width: 34px; height: 20px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 99px; cursor: pointer; transition: .15s; }
.switch span::after { content: ""; position: absolute; width: 14px; height: 14px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
.switch input:checked + span { background: var(--accent); } .switch input:checked + span::after { transform: translateX(14px); }
.ctrl { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.ctrl label { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; cursor: pointer; background: var(--panel); display: block; }
.ctrl input { margin-right: 6px; } .ctrl label.sel { border-color: var(--accent); background: var(--accent-soft); }
pre.cmd { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 44px 8px 10px; margin: 6px 0; overflow-x: auto; font-family: var(--mono); font-size: 12.5px; position: relative; white-space: pre-wrap; word-break: break-all; }
.copy { position: absolute; top: 5px; right: 5px; }
table { width: 100%; border-collapse: collapse; }
td, th { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
.savebar { position: sticky; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 10px 20px; display: none; align-items: center; gap: 10px; flex-wrap: wrap; z-index: 5; }
.savebar.show { display: flex; }
#toast { position: fixed; right: 16px; bottom: 70px; background: var(--text); color: var(--bg); padding: 9px 14px; border-radius: 8px; opacity: 0; transition: .2s; pointer-events: none; max-width: 80vw; z-index: 10; }
#toast.show { opacity: 1; }
.err { background: var(--bad-soft); color: var(--bad); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; }
.steps { counter-reset: s; list-style: none; padding: 0; margin: 0; }
.steps > li { counter-increment: s; position: relative; padding-left: 36px; margin-bottom: 16px; }
.steps > li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; display: grid; place-items: center; font-size: 12px; }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  nav { position: static; display: flex; overflow-x: auto; gap: 4px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  nav button { width: auto; white-space: nowrap; padding: 6px 10px; }
  .prow-body { padding-left: 14px; } .prow-model { display: none; }
  main { padding: 16px; }
  .bar { padding: 10px 16px; gap: 8px; } .bar label[for=scope] { display: none; } #scope { max-width: 150px; font-size: 13px; padding: 4px 6px; }
  .proj { max-width: 100%; order: 5; flex-basis: 100%; }
  table { display: block; overflow-x: auto; }
  td input[type=password] { min-width: 140px; }
}
.sub .mono, td.mono, .note .mono, p .mono { word-break: break-all; } /* long paths and patterns wrap instead of widening the page */
body { overflow-x: hidden; }
</style>

<body>
<header>
  <div class="bar">

<script>
const TOKEN = new URLSearchParams(location.hash.slice(1)).get('t') || '';
// the open page lives in the address (#t=…&p=roles), so a reload or a shared link opens the same page
function pageFromHash() { const p = new URLSearchParams(location.hash.slice(1)).get('p'); return ['overview', 'runs', 'roles', 'providers', 'skills', 'lessons', 'keys', 'settings', 'setup'].includes(p) ? p : 'overview'; }
function go(page) {

  const h = new URLSearchParams(location.hash.slice(1)); h.set('p', page); h.delete('run'); runOpen = null; runDet = null;
  history.pushState(null, '', `#${h}`);
  render();
}
addEventListener('popstate', () => { tab = pageFromHash(); const r = new URLSearchParams(location.hash.slice(1)).get('run'); if (r !== runOpen) { runOpen = r; runDet = null; } if (S) render(); });
// small stroke icons (24x24 paths), drawn for this page
const ICONS = {
  overview: 'M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z',

};
const icon = (n, t = '') => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"${t ? ` title="${t}"` : ''}><path d="${ICONS[n]}"/></svg>`;
const TABS = [['overview', 'Overview'], ['runs', 'Runs'], ['roles', 'Roles'], ['providers', 'Providers'], ['skills', 'Skills'], ['lessons', 'Lessons & rules'], ['keys', 'API keys'], ['settings', 'Settings'], ['setup', 'Setup']];
let S = null, W = null, tab = pageFromHash(), dirty = false, freeModels = null, runsData = null, gOpen = null, gFilter = { q: '', cat: 'all' };
let rPreview = null; // routing preview result
let rTab = null; // the role shown on the Roles page (tabs)
const roleTab = () => (rTab && W.roles[rTab] ? rTab : Object.keys(W.roles)[0]);
let runOpen = new URLSearchParams(location.hash.slice(1)).get('run'), runDet = null; // the run page (#p=runs&run=<id>)
let ctrlPick = null; // controller picked in Settings but not applied yet (a project action, not part of Save)
let rtLib = null, rtLibKey = '', rtLibOpen = null; // rule library, resolved against the current (unsaved) providers
const ROUTING_GUIDE = 'https://github.com/KevalParikh22/conductor-ai/blob/main/docs/ROUTING.md';
function loadRtLib() {
  const key = JSON.stringify([Object.keys(W.providers).filter((n) => W.providers[n].enabled), (W.routes || []).map((r) => r.from)]);
  if (key === rtLibKey) return; rtLibKey = key;
  api('POST', '/api/route-templates', { providers: W.providers, routes: W.routes || [] }).then((d) => { rtLib = d.templates; if (tab === 'roles') render(); }, () => {});
}
let localInfo = null, localAt = 0; // local model servers, refreshed at most every 30s
function loadLocal() { if (Date.now() - localAt < 30000) return; localAt = Date.now(); api('GET', '/api/local').then((d) => { localInfo = d.local; if (tab === 'providers' || tab === 'setup') render(); }, () => {}); }
let pAll = false, pAdd = false; const pOpen = new Set(); // providers page: show disabled, gallery open, expanded rows

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = (x) => JSON.parse(JSON.stringify(x));

try { const t = localStorage.getItem('conductor-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
const curTheme = () => document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
const themeIcon = () => { $('#theme').innerHTML = icon(curTheme() === 'dark' ? 'sun' : 'moon'); };
themeIcon();
$('#theme').onclick = () => {
  const next = curTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next; themeIcon();
  try { localStorage.setItem('conductor-theme', next); } catch {}
};

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { 'content-type': 'application/json', 'x-conductor-token': TOKEN }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }
function markDirty() { dirty = true; $('#savebar').classList.add('show'); $('#savewhere').textContent = ' → ' + ($('#scope').value === 'global' ? 'global config (all projects)' : 'this project'); }
function load(state) { S = state; W = clone(S.effective); dirty = false; $('#savebar').classList.remove('show'); $('#proj').textContent = S.root; render(); }

$('#save').onclick = async () => {
  try { load(await api('PUT', '/api/config', { scope: $('#scope').value, effective: W })); toast('Saved'); }
  catch (e) { toast('Not saved: ' + e.message); }
};
$('#discard').onclick = () => load(S);
$('#scope').onchange = () => { if (dirty) markDirty(); try { localStorage.setItem('conductor-scope', $('#scope').value); } catch {} };

function renderNav() {
  $('#nav').innerHTML = TABS.map(([k, l]) => `<button data-tab="${k}" class="${k === tab ? 'active' : ''}">${icon(k)}${l}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach((b) => b.onclick = () => go(b.dataset.tab));
}
function provStatus(name) { return S.status.providers.find((p) => p.name === name) || { ready: false, reason: 'unknown' }; }
function locPill(p) { const l = p.location || 'cloud-api'; return `<span class="pill ${l}">${{ 'local-agent': 'local agent', 'local-model': 'local model', 'cloud-api': 'cloud API', manual: 'you, in a web chat' }[l] || l}</span>`; }
function readyPill(name) { const st = provStatus(name); const w = W.providers[name]; if (w && !w.enabled) return '<span class="pill">disabled</span>'; if (st.optional) return '<span class="pill">optional: add key</span>'; if (st.cooling) return `<span class="pill warn" title="${esc(st.reason)}">cooling down</span>`; return st.ready ? '<span class="pill ok">ready</span>' : `<span class="pill bad">${esc(st.reason)}</span>`; }
// short status for tight rows; the full reason is in the title
const shortReason = (r) => /not set/.test(r) ? 'no key' : /not installed/.test(r) ? 'not installed' : r.length > 22 ? r.slice(0, 20) + '…' : r;
function copyBtn(text) { return `<button class="btn small copy" data-copy="${esc(text)}" title="Copy">${icon('copy')}</button>`; }
function cmd(text) { return `<pre class="cmd">${esc(text)}${copyBtn(text)}</pre>`; }
function bindCopy() { document.querySelectorAll('[data-copy]').forEach((b) => b.onclick = () => { navigator.clipboard?.writeText(b.dataset.copy).then(() => toast('Copied'), () => toast('Copy failed')); }); }

function loadOverviewExtras() { Promise.all([api('GET', '/api/stats'), api('GET', '/api/guard')]).then(([st, g]) => { statsData = st; guardData = g; if (tab === 'overview') render(); }, () => { statsData = statsData || {}; guardData = guardData || {}; }); }

function openRun(id) {
  runOpen = id; runDet = null;
  const h = new URLSearchParams(location.hash.slice(1)); if (id) h.set('run', id); else h.delete('run');
  history.pushState(null, '', `#${h}`);

let runFetching = null;
function fetchRun(id) {
  if (runFetching === id) return;
  runFetching = id;
  api('GET', `/api/run?id=${encodeURIComponent(id)}`).then((d) => { runFetching = null; if (runOpen === id) { runDet = d; if (tab === 'runs') render(); } },
    (e) => { runFetching = null; toast(e.message); runOpen = null; render(); });
}
function overviewExtras() {
  if (!statsData || !guardData) { loadOverviewExtras(); return ''; }
  const q = statsData.quality, g = guardData;
  const quality = q ? `<div class="card stat"><div class="l" title="Done with one worker, no hand-off or retry (conductor stats)">Accepted first try (${q.days} days)</div><div class="n">${q.writeTasks ? `${q.firstTryRate}%` : '–'}</div><div class="note">${q.writeTasks ? `${q.firstTry} of ${q.writeTasks} write tasks · alpha gate: ${esc(q.gate)}` : 'no write tasks yet'}</div></div>` : '';
  const guard = g.controller ? `<div class="card stat"><div class="l" title="conductor guard">Commit guard</div><div class="n" style="font-size:16px">${!g.supported ? 'not available' : g.on ? 'on' : 'off'}</div><div class="note">${g.supported ? `blocks the controller's commit while the last verify failed · last verify: ${g.lastVerify ? esc(g.lastVerify.status) : 'none'}` : 'only Claude Code and Antigravity'}</div>${g.supported ? `<button class="btn small" id="guard-toggle" style="margin-top:6px">${g.on ? 'Turn off' : 'Turn on'}</button>` : ''}</div>` : '';
  // failure causes (this project's runs, then worker attempts everywhere) and the weekly first-try trend
  const f = statsData.failures || {};
  const causes = (f.causes || []).slice(0, 4), kinds = (f.attempts || []).slice(0, 3);
  const why = causes.length || kinds.length ? `<div class="card"><h2>Why work failed (${f.days} days)</h2>
    ${causes.length ? `<table><tr><th>Runs not done</th><th>How many</th></tr>${causes.map((c) => `<tr><td>${esc(c.cause)}</td><td>${c.count}</td></tr>`).join('')}</table>` : '<p class="note">Every run in this project ended done.</p>'}
    ${kinds.length ? `<p class="note" style="margin-top:8px">Failed worker attempts (all projects): ${kinds.map((k) => `${esc(k.kind)} <b>${k.count}</b>`).join(' · ')}. Details: <span class="mono">conductor stats --failures</span></p>` : ''}</div>` : '';
  const tr = statsData.trend || [];
  const trend = tr.some((w) => w.writeTasks) ? `<div class="card"><h2>Accepted first try, by week</h2><div class="trend">${tr.map((w) => `<div class="tw" title="${esc(`week of ${w.week}: ${w.writeTasks ? `${w.firstTry} of ${w.writeTasks} write tasks` : 'no write tasks'}`)}">
      <div class="tbar"><span style="height:${w.rate ?? 0}%" class="${w.rate == null ? '' : w.rate >= 70 ? 'ok' : 'low'}"></span></div><b>${w.rate == null ? '–' : `${w.rate}%`}</b><span class="note">${esc(w.week.slice(5))}</span></div>`).join('')}</div>
    <p class="note">The alpha gate is 70% or more over at least 10 write tasks. Hover a week for its numbers.</p></div>` : '';
  return `${quality || guard ? `<div class="grid">${quality}${guard}</div>` : ''}${why}${trend}`;
}
const GATE_PILL = { pass: 'ok', fail: 'bad', missing: 'bad', waived: 'warn', off: 'warn', skipped: '', unknown: 'warn', waiting: 'warn' };
function runPage() {
  const back = '<button class="btn small" id="run-back">← All runs</button>';
  if (!runDet) { fetchRun(runOpen); return `<div class="head">${back}<h1>Run</h1><p class="sub">Loading…</p></div>`; }
  const d = runDet;
  const det = (title, body, open = false) => body ? `<details class="card" ${open ? 'open' : ''}><summary><b>${title}</b></summary><pre class="cmd" style="max-height:480px">${esc(body)}</pre></details>` : '';
  const next = d.branch ? [`conductor diff ${d.branch}`, `git merge --no-ff ${d.branch}`, `conductor worktree rm ${d.worktreeId}`, `conductor worktree rm ${d.worktreeId} --force`] : [];
  return `<div class="head">${back}<h1>${esc(d.role)}${d.task ? ` · ${esc(d.task)}` : ''}</h1>
    <p class="sub"><span class="mono">${esc(d.id)}</span>${d.plan ? ` · plan <span class="mono">${esc(d.plan)}</span>` : ''} · ${d.validated ? '<span class="pill ok">validated: every required check passed</span>' : '<span class="pill bad">not validated</span>'} · result <b>${esc(d.state)}</b></p></div>
    <div class="card"><h2>Checks</h2><p class="note">A run counts as done only when every required check passes (or was waived on purpose). Info rows don't decide it.</p>
      <table><tr><th>Check</th><th>Result</th><th>Evidence</th></tr>${d.gates.map((g) => `<tr><td>${esc(g.label)}${g.required ? '' : ' <span class="note">(info)</span>'}</td>
        <td><span class="pill ${GATE_PILL[g.status] ?? ''}">${esc(g.status)}</span></td>
        <td>${esc(g.evidence || '')}${g.seconds != null ? ` <span class="note">(${g.seconds}s)</span>` : ''}${g.log && d.logs[g.id] ? `<details><summary class="note">log: <span class="mono">${esc(g.log)}</span></summary><pre class="cmd">${esc(d.logs[g.id])}</pre></details>` : ''}</td></tr>`).join('')}</table></div>
    <div class="card"><h2>Attempts</h2><table><tr><th>Worker</th><th>Result</th><th>Time</th><th>Tokens in / out</th><th>What to do</th></tr>${d.attempts.map((a) => `<tr>
      <td><b>${esc(a.provider)}</b>${a.model ? `<div class="note mono">${esc(a.model)}</div>` : ''}</td>
      <td>${a.ok ? '<span class="pill ok">ok</span>' : `<span class="pill ${a.skipped ? '' : /^waiting/.test(a.reason) ? 'warn' : 'bad'}">${esc(a.skipped ? 'skipped' : /^waiting/.test(a.reason) ? 'waiting' : 'failed')}</span><div class="note">${esc(a.reason)}</div>`}</td>
      <td>${a.seconds != null ? `${a.seconds}s` : ''}</td><td>${a.tokens ? `${(a.tokens.input || 0).toLocaleString()} / ${(a.tokens.output || 0).toLocaleString()}` : '–'}</td>
      <td class="note">${esc(a.next || '')}</td></tr>`).join('')}</table>
      ${d.warnings.length ? d.warnings.map((w) => `<div class="note">⚠ ${esc(w)}</div>`).join('') : ''}</div>
    ${d.waiting && !d.waiting.importedAs ? `<div class="card"><h2>Waiting for your answer</h2><p class="note">Paste this prompt (${d.waiting.chars} characters) into any web chat (DeepSeek, Kimi, Qwen, Gemini, ChatGPT…), then paste its whole answer below. conductor applies and checks it like any worker's; it never opens the chat itself.</p>
      <div class="row"><button class="btn small" id="mw-copy">${icon('copy')} Copy prompt</button><span class="note mono">${esc(d.waiting.prompt)}</span></div>
      <textarea id="mw-answer" rows="10" style="width:100%;margin-top:8px;font-family:var(--mono);font-size:12.5px" placeholder="Paste the chat's answer here"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn primary" id="mw-import">Import the answer</button><span class="note">Same as <span class="mono">conductor import ${esc(d.id)} answer.md</span></span></div></div>` : d.waiting?.importedAs ? `<div class="card"><h2>Answered</h2><p class="note">Your answer was imported as <a href="#" data-run="${esc(d.waiting.importedAs)}">run ${esc(d.waiting.importedAs)}</a>.</p></div>` : ''}
    ${next.length ? `<div class="card"><h2>Next</h2><p class="note">Review the diff, then merge it, or discard the branch. Run these in the project.</p>${cmd(next[0])}${cmd(next[1])}${cmd(next[2])}<p class="note">Discard instead:</p>${cmd(next[3])}</div>` : ''}
    ${d.changed.length ? `<div class="card"><h2>Files changed</h2><div class="mono">${d.changed.map(esc).join('<br>')}</div></div>` : ''}
    ${det('Report', d.report, true)}${det('Diff', d.diff)}`;
}

      running: '<span class="pill warn">running</span>',
      done: r.validated === false ? '<span class="pill warn" title="A required check did not pass">not validated</span>' : '<span class="pill ok" title="Every required check passed">done</span>',
      partial: `<span class="pill warn" title="${esc(r.status || 'the worker did only part of the task')}">partial</span>`,
      'verify-failed': '<span class="pill bad" title="The worker finished, but verify fails">verify failed</span>',

      <div class="card stat"><div class="l">Known API cost today</div><div class="n">${money(usage.today)}</div><div class="note">${budget ? `daily budget ${money(budget)}` : 'no daily budget (Settings)'}</div></div>
    </div>
    <div class="card"><h2>Recent runs</h2>${runs.length ? `<table><tr><th>When</th><th>Role · task</th><th>Result</th><th>Worker</th><th>Verify</th><th>Files</th><th>Time</th></tr>
      ${runs.map((r) => `<tr><td class="mono">${r.state === 'running' ? esc(r.startedAt ? new Date(r.startedAt).toLocaleString() : r.id) : `<a href="#" data-run="${esc(r.id)}" title="Checks, attempts, report and diff">${esc(r.startedAt ? new Date(r.startedAt).toLocaleString() : r.id)}</a>`}</td>
        <td><b>${esc(r.role)}</b>${r.task ? ` · ${esc(r.task)}` : ''}${r.branch ? `<div class="note mono">${esc(r.branch)}</div>` : ''}</td>

        <td>${esc(r.winner || '–')}${r.why ? `<div class="note">${esc(r.why)}</div>` : ''}${r.attempts?.length > 1 ? `<div class="note">${r.attempts.map((a) => a.ok ? `${esc(a.provider)} ✓` : `<span title="${esc(a.reason + (a.next ? ' — next: ' + a.next : ''))}">${esc(a.provider)} ✗</span>`).join(' → ')}</div>` : ''}</td>

    ${!S.hasProjectConfig && S.inRepo ? `<div class="card"><h2>This project isn't set up yet</h2><p class="note">Add the rules file, controller commands and plan template to <span class="mono">${esc(S.root)}</span>.</p><button class="btn primary" data-goto="settings">Set up this project</button></div>` : ''}`;

    return `<div class="head"><h1>Roles</h1><p class="sub">Each role tries its providers top to bottom; when one is rate-limited, fails or isn't installed, the next runs. If all fail, the controller does the task.</p></div>

          <button class="btn small ghost" data-rtedit="${esc(t.id)}" title="Copy into the form below to change it first">Customize</button></div>
          <span class="note">${esc(t.why)}</span>
          <span class="note">${when(t.route) || 'any task'} → <b>${esc([].concat(t.route.provider).join(', ') || t.want)}</b></span></div>`).join('')}</div>` : '<p class="note">Loading…</p>'}

    <div class="roles">${Object.entries(W.roles).filter(([r]) => r === roleTab()).map(([r, chain]) => `<div class="card"><div class="row"><h2 style="margin:0">${esc(S.roles[r]?.label || r)}</h2>${S.roles[r]?.mode === 'read' ? '<span class="pill">read-only</span>' : '<span class="pill warn">edits files</span>'}</div>

  providers() {

        <div class="note" style="margin-top:6px">When a model is rate-limited (or, for APIs, stalls), the next fallback model runs on the same provider before the chain moves on. A worker that runs past its time limit is stopped and the next provider takes over.</div>

      </div><div class="note" id="test-${esc(n)}" style="padding:0 14px"></div></div>`; };
    return `<div class="head"><h1>Providers</h1><span class="spacer"></span>
        <div class="seg"><button data-pall="0" class="${pAll ? '' : 'on'}">Enabled (${on.length})</button><button data-pall="1" class="${pAll ? 'on' : ''}">All (${all.length})</button></div>
        <button class="btn ${pAdd ? '' : 'primary'}" id="padd">${icon(pAdd ? 'x' : 'plus')} ${pAdd ? 'Close' : 'Add provider'}</button>
        <p class="sub">Switch providers on or off; open a row for its model, endpoint and permissions. Keys live in API keys, never in config files.</p></div>
      <datalist id="dl-oc">${['opencode/big-pickle', 'opencode/glm-5.3-flash-free', 'opencode/deepseek-v4.1-flash-free', 'opencode/nemotron-3-ultra-free', 'opencode/mimo-v2.6-flash-free'].map((m) => `<option value="${m}">`).join('')}</datalist>

  },
  keys() {
    const keys = S.secrets.filter((k) => k.set || k.usedBy.some((n) => W.providers[n]?.enabled));
    return `<div class="head"><h1>API keys</h1><p class="sub">Saved in <span class="mono">${esc(S.paths.secrets)}</span> (only you can read it), never in config or git. Real environment variables win. Showing keys that are set or used by an enabled provider.</p></div>
    <div class="card"><table><tr><th>Variable</th><th>Status</th><th>Used by</th><th style="width:38%">Set / replace</th></tr>
    ${keys.map((k) => `<tr><td class="mono">${esc(k.name)}</td><td>${k.set ? `<span class="pill ok">set ${esc(k.hint)}</span> <span class="note">${esc(k.source)}</span>` : '<span class="pill" title="Optional: only the providers that use this key need it">not set</span>'}</td><td class="note">${esc(k.usedBy.join(', ') || '-')}</td>
      <td><div class="row" style="flex-wrap:nowrap"><input type="password" data-key="${esc(k.name)}" placeholder="paste key" autocomplete="off"><button class="btn small" data-savekey="${esc(k.name)}">Save</button>${k.source === 'secrets file' ? `<button class="btn small" data-delkey="${esc(k.name)}">Remove</button>` : ''}</div></td></tr>`).join('')}
    </table></div>
    <p class="note">Need a key? Each provider's guide links to where you get one: <b>Providers → Add provider</b> (filter <b>Free</b>), or <span class="mono">conductor providers --free</span>. kilo-free and OVHcloud work without one.</p>`;
  },
  settings() {
    // shown in the unit people think in (minutes, KB); saved in the unit the config uses (seconds, bytes)
    const st = W.settings; const num = (k, l, h, factor = 1) => `<div><label class="f">${l}</label><input type="number" min="0" step="any" data-set="${k}" data-factor="${factor}" value="${esc(st[k] == null ? '' : Math.round((st[k] / factor) * 100) / 100)}"><div class="note">${h}</div></div>`;
    const chk = (k, l) => `<label class="row"><input type="checkbox" data-setb="${k}" ${st[k] ? 'checked' : ''}> ${l}</label>`;
    return `<div class="head"><h1>Settings</h1><p class="sub">Defaults suit most projects.</p></div>
    <div class="card"><h2>Controller</h2><p class="note" style="margin-top:-4px">The agent that plans, delegates, reviews and commits. Applying writes its instruction file, <span class="mono">/conduct-*</span> commands and MCP entry into this project, keeping your own content.</p>
      ${(() => { const cur = S.effective.controller, pick = ctrlPick || cur, lbl = (k) => esc(S.controllers[k]?.label || k); return `
      <div class="ctrl">${Object.entries(S.controllers).map(([k, c]) => `<label class="${pick === k ? 'sel' : ''}"><input type="radio" name="ctrl" value="${k}" ${pick === k ? 'checked' : ''}><b>${esc(c.label)}</b><div class="note">${esc(c.file)}${k === cur ? ' · current' : ''}</div></label>`).join('')}</div>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="apply-ctrl" ${S.inRepo && pick !== cur ? '' : 'disabled'}>${pick !== cur ? `Switch this project to ${lbl(pick)}` : `${lbl(cur)} is this project's controller`}</button>`; })()}<label class="row note"><input type="checkbox" id="ctrl-mcp" checked> also register the MCP server</label>${S.inRepo ? '' : '<span class="note">Open the UI inside a git project to apply.</span>'}</div>
      <pre class="cmd" id="init-out" style="display:none"></pre></div>
    <div class="card"><h2>Runs</h2><div class="fields">
      ${num('timeoutSec', 'Time limit per attempt (minutes)', 'A worker is stopped and the next one tried (a plan task\'s eta: line can raise it)', 60)}
      ${num('cooldownMinutes', 'Cooldown after rate limit (minutes)', "Rate-limited providers are skipped this long (or for the provider's Retry-After)")}
      ${num('maxDiffBytes', 'Max review diff (KB)', 'Larger diffs are cut for review', 1000)}
      ${num('maxContextBytes', 'Max file context for API models (KB)', 'File content sent to chat-only providers', 1000)}
      ${num('dailyBudgetUSD', 'Daily budget for paid APIs ($)', '0 = no cap. Counts API providers with a price set; free ones never count')}
      <div><label class="f">Verify command</label><input type="text" data-sets="verify" value="${esc(st.verify)}" placeholder="auto: AGENTS.md Verify line, then npm/composer/pytest/cargo/go"><div class="note">Must pass before a task counts as done.${!st.verify && S.status.verify ? ` Detected now: <span class="mono">${esc(S.status.verify)}</span>` : ''}</div></div>
      <div><label class="f">Protected branches</label><input type="text" data-setl="protectedBranches" value="${esc((st.protectedBranches || []).join(', '))}"><div class="note">Workers never write on these</div></div>
      </div><div style="margin-top:12px;display:grid;gap:6px">${chk('smartSelect', 'Smart selector: try the cheapest capable provider first (free API models for small tasks, agents for big ones)')}${chk('requireCleanTree', 'Require a clean git tree before write roles (enables safe stash-on-failure)')}${chk('autoVerify', 'Run verify automatically after each write task')}</div></div>`;
  },
  setup() {
    const p = S.presets, sec = Object.fromEntries(S.secrets.map((x) => [x.name, x.set]));
    // red only for what conductor needs (git, Node); optional things (an agent you don't use, a project not set up yet) stay neutral
    const pill = (ok, yes, no, level = 'bad') => ok ? `<span class="pill ok">${yes}</span>` : `<span class="pill ${level}">${no}</span>`;
    const agents = Object.values(p).filter((v) => v.installed).length;
    const freeKeys = ['OPENROUTER_API_KEY', 'OPENCODE_API_KEY', 'GEMINI_API_KEY', 'GROQ_API_KEY', 'CEREBRAS_API_KEY'].filter((n) => sec[n]).length;
    const link = (u) => `<a href="https://${u}" target="_blank" rel="noopener">${u}</a>`;
    return `<div class="head"><h1>Setup</h1><p class="sub">Install once per machine, run <span class="mono">conductor setup</span>, then <span class="mono">conductor init</span> in each project. kilo-free works with no key and no install. Everything in one place: <a href="https://github.com/KevalParikh22/conductor-ai/blob/main/docs/GUIDE.md" target="_blank" rel="noopener">the conductor guide</a>.</p></div>
    <div class="card"><h2>This machine</h2><table><tr><th>Check</th><th>Status</th><th>How to fix</th></tr>
      <tr><td>Node.js 20+</td><td>${pill(+S.env.node.slice(1).split('.')[0] >= 20, esc(S.env.node), esc(S.env.node) + ' (too old)')}</td><td class="mono">nvm install 22</td></tr>
      <tr><td>git</td><td>${pill(S.env.git, 'installed', 'missing')}</td><td class="note">Needed for worktrees, evidence checks and rollback</td></tr>
      <tr><td>conductor ${esc(S.version)}</td><td>${pill(S.env.conductorOnPath, 'on PATH', 'not on PATH')}</td><td class="note">${S.env.conductorOnPath ? 'Ready' : 'Add <span class="mono">$(npm prefix -g)/bin</span> to PATH'}</td></tr>
      <tr><td>This project</td><td>${pill(S.hasProjectConfig, 'initialised', 'not set up yet', '')}</td><td class="mono">${S.hasProjectConfig ? '' : 'conductor init'}</td></tr>
      <tr><td>Worker agents</td><td>${pill(agents, agents + ' installed', 'none installed')}</td><td class="note">Optional: free API providers work without one</td></tr>
      <tr><td>Local models</td><td>${(() => { loadLocal(); const run = (localInfo || []).filter((l) => l.running); return !localInfo ? '<span class="pill">checking…</span>' : run.length ? `<span class="pill ok">${run.map((l) => esc(l.label)).join(', ')}</span>` : '<span class="pill">none running</span>'; })()}</td><td class="note">${(localInfo || []).find((l) => l.next)?.next ? esc((localInfo || []).find((l) => l.next).next) : 'Optional: <a href="https://ollama.com/download" target="_blank" rel="noopener">Ollama</a>, then <span class="mono">ollama pull qwen3-coder</span>'}</td></tr>
      <tr><td>Free API keys</td><td>${freeKeys ? `<span class="pill ok">${freeKeys} set</span>` : '<span class="pill">none yet</span>'}</td><td class="note">kilo-free works without a key</td></tr>
    </table></div>
    <div class="card"><h2>Steps</h2><ol class="steps">
      <li><b>Install conductor</b> (once per machine; run it again to update)${cmd('curl -fsSL https://raw.githubusercontent.com/KevalParikh22/conductor-ai/main/scripts/install.sh | bash')}<span class="note">Or with npm directly:</span>${cmd('npm install -g github:KevalParikh22/conductor-ai\nconductor setup')}<span class="note">If npm asks for sudo, use a Node version manager (nvm, fnm) instead.</span></li>
      <li><b>Pick your workers.</b> Choose a free start, subscription agents, or both. Every role falls back down its chain, so you can mix them.
        <div class="grid2" style="margin-top:10px">
          <div class="mini"><b>Free, no install</b><ul class="note" style="margin:6px 0 0;padding-left:18px">
            <li><b>kilo-free</b> and <b>OVHcloud</b>: no key at all</li>
            <li><b>OpenRouter</b>, <b>Gemini</b>, <b>Groq</b>, <b>Cerebras</b>: free keys</li>
            <li><b>Ollama</b>, <b>LM Studio</b>: local and private</li></ul>
            <span class="note">Add any with <span class="mono">conductor add &lt;name&gt;</span> or Providers → Add provider.</span></div>
          <div class="mini"><b>Coding agents (your subscriptions)</b><ul class="note" style="margin:6px 0 0;padding-left:0;list-style:none">
            ${Object.entries(p).map(([k, v]) => k === S.controllerPreset
              ? `<li>· <b>${esc(v.label.replace(/ \(as a worker\)$/, ''))}</b> <span class="note">your controller, so off as a worker (it would spend the quota conductor saves)</span></li>`
              : `<li>${v.installed ? '✓' : '○'} <b>${esc(v.label)}</b></li>`).join('')}</ul>
            <span class="note">Agents edit files and run tests themselves, each under its own permission rules. Install commands are below.</span></div>
        </div></li>
      <li><b>Add providers</b>: <span class="mono">conductor add groq</span> asks for the key, picks a model and tests it. Or use <button class="btn small" data-goto="providers">Providers → Add provider</button></li>
      <li><b>Set up each project</b>${cmd('cd my-project\nconductor init            # controller: claude-code (default), antigravity, codex-cli, opencode')}<span class="note">init detects the Verify command from your project (e.g. <span class="mono">npm run test</span>, <span class="mono">vendor/bin/phpunit</span>) and writes it into AGENTS.md. Check it, and fill in the stack in section 1.</span></li>
      <li><b>Check everything</b>: <span class="mono">--live</span> sends one tiny prompt to each enabled provider and shows which ones answer.${cmd('conductor doctor --live')}</li>
      <li><b>Try a free run</b> (read-only, changes nothing):${cmd('conductor ask "What does this project do? List the main folders." --chain kilo-free')}<span class="note">Then try a small write task on a test branch: <span class="mono">conductor docs "add a usage section to README" --chain kilo-free,openrouter-free</span>. Check the result on the Runs page.</span></li>
      <li><b>Use it from your controller.</b> In Claude Code: <span class="mono">/conduct-plan add password reset</span>, answer the plan's open questions, then <span class="mono">/conduct-run docs/plan/password-reset.md</span>. Other controllers read the same instructions from AGENTS.md or GEMINI.md.</li>
    </ol></div>
    <div class="card"><details class="more"><summary>${icon('chev')} <b style="color:var(--text)">Coding agents: install and sign in</b> (${Object.values(p).filter((v) => v.installed).length} of ${Object.keys(p).length} installed)</summary><table><tr><th>Agent</th><th>Status</th><th>Install</th><th>Sign in</th></tr>
      ${Object.values(p).map((v) => `<tr><td>${esc(v.label)}</td><td>${pill(v.installed, 'installed', 'not installed', '')}</td><td>${cmd(v.install.split(/\s+\(or: /)[0])}${/\(or: /.test(v.install) ? `<span class="note">or: <span class="mono">${esc(v.install.split(/\(or: /)[1].replace(/\)$/, ''))}</span></span>` : ''}</td><td class="mono">${esc(v.login)}</td></tr>`).join('')}
    </table><p class="note">After installing, run <span class="mono">conductor setup</span> (it turns on what it finds) or switch the agent on in Providers.</p></details></div>
    <div class="card"><details class="more"><summary>${icon('chev')} <b style="color:var(--text)">Update or remove</b></summary>${cmd('npm install -g github:KevalParikh22/conductor-ai   # update to latest\nconductor --version\nnpm uninstall -g conductor-ai                       # remove')}<span class="note">Settings and keys stay in <span class="mono">${esc(S.paths.global.replace(/[^/\\]+$/, ''))}</span>. Delete that folder to remove them too.</span></details></div>
`;
  },
};

function render() {
  renderNav();
  $('#main').innerHTML = views[tab]();
  bindCopy(); bind();
}

function bind() {
  const la = $('#ls-add'); if (la) la.onclick = async () => { try { lessonsData = await api('POST', '/api/lessons/add', { text: $('#ls-text').value.trim(), files: $('#ls-files').value.split(',').map((x) => x.trim()).filter(Boolean) }); render(); toast('Lesson added'); } catch (e) { toast(e.message); } };
  document.querySelectorAll('[data-lsrm]').forEach((b) => b.onclick = async () => { try { lessonsData = await api('POST', '/api/lessons/remove', { id: b.dataset.lsrm }); render(); toast('Removed'); } catch (e) { toast(e.message); } });
  document.querySelectorAll('[data-lspromote]').forEach((b) => b.onclick = async () => { try { const r = await api('POST', '/api/lessons/promote', { id: b.dataset.lspromote }); lessonsData = r; render(); toast(`Added to AGENTS.md: ${r.bullet}`); } catch (e) { toast(e.message); } });
  const gt = $('#guard-toggle'); if (gt) gt.onclick = async () => { try { guardData = await api('POST', '/api/guard', { on: !guardData.on }); render(); toast(`Commit guard ${guardData.on ? 'on' : 'off'}`); } catch (e) { toast(e.message); } };
  document.querySelectorAll('[data-run]').forEach((a) => a.onclick = (e) => { e.preventDefault(); openRun(a.dataset.run); });
  const rb = $('#run-back'); if (rb) rb.onclick = () => { openRun(null); loadRuns(); };
  const mc = $('#mw-copy'); if (mc) mc.onclick = () => navigator.clipboard?.writeText(runDet?.waiting?.promptText || '').then(() => toast('Prompt copied: paste it into the web chat'), () => toast('Copy failed: open the prompt file'));
  const mi = $('#mw-import'); if (mi) mi.onclick = async () => {
    const text = $('#mw-answer').value.trim();
    if (!text) { toast('Paste the answer first'); return; }
    mi.disabled = true; mi.textContent = 'Checking the answer…';
    try { const r = await api('POST', '/api/import', { run: runDet.id, text }); toast(`Imported as run ${r.run}: ${r.outcome || 'done'}`); openRun(r.run); } catch (e) { toast(e.message); mi.disabled = false; mi.textContent = 'Import the answer'; }
  };
  const skr = async (p, body, msg) => { try { skillsData = await api('POST', p, body); render(); if (msg) toast(msg); return true; } catch (e) { toast(e.message); return false; } };
  const skn = $('#sk-newbtn'); if (skn) skn.onclick = () => { skillNew = !skillNew; render(); };
  const skc = $('#sk-create'); if (skc) skc.onclick = () => skr('/api/skills/new', { name: $('#sk-name').value.trim(), scope: $('#sk-scope').value, description: $('#sk-desc').value.trim(), files: $('#sk-files').value.trim(), roles: $('#sk-roles').value.trim(), text: $('#sk-text').value.trim() }, 'Skill created. Write its instructions with Edit').then((ok) => { if (ok) { skillNew = false; render(); } });
  const sks = $('#sk-sync'); if (sks) sks.onclick = () => skr('/api/skills/sync', {}, 'Skills synced');
  document.querySelectorAll('[data-skon]').forEach((i) => i.onchange = () => skr('/api/skills/toggle', { name: i.dataset.skon, on: i.checked }, `${i.dataset.skon} ${i.checked ? 'on' : 'off'} for this project`));
  document.querySelectorAll('[data-skedit]').forEach((b) => b.onclick = () => { skillEdit = skillEdit === b.dataset.skedit ? null : b.dataset.skedit; render(); });
  document.querySelectorAll('[data-sksave]').forEach((b) => b.onclick = () => skr('/api/skills/save', { name: b.dataset.sksave, text: $(`#sk-text-${b.dataset.sksave}`).value }, 'Saved and synced'));
  document.querySelectorAll('[data-skrm]').forEach((b) => b.onclick = () => { const [name, scope] = b.dataset.skrm.split('|'); if (confirm(`Remove ${name} from the ${scope === 'global' ? 'library for all projects' : 'project library'}? This deletes its folder.`)) { skillEdit = null; skr('/api/skills/remove', { name, scope }, 'Removed'); } });
  document.querySelectorAll('[data-goto]').forEach((b) => b.onclick = (e) => { e.preventDefault(); go(b.dataset.goto); }); // links too: "#" would drop the token
  document.querySelectorAll('[data-clear]').forEach((b) => b.onclick = async () => { load(await api('POST', '/api/cooldowns/clear', { name: b.dataset.clear })); toast('Cooldown cleared'); });
  document.querySelectorAll('[data-rtab]').forEach((b) => b.onclick = () => { rTab = b.dataset.rtab; render(); });
  document.querySelectorAll('[data-mv]').forEach((b) => b.onclick = () => { const [r, i, d] = b.dataset.mv.split('|'); const c = W.roles[r]; const j = +i + +d; [c[i], c[j]] = [c[j], c[i]]; markDirty(); render(); });
  document.querySelectorAll('[data-rm]').forEach((b) => b.onclick = () => { const [r, i] = b.dataset.rm.split('|'); W.roles[r].splice(+i, 1); markDirty(); render(); });
  document.querySelectorAll('[data-addsel]').forEach((s) => s.onchange = () => { if (s.value) { W.roles[s.dataset.addsel].push(s.value); markDirty(); render(); } });
  document.querySelectorAll('[data-en]').forEach((c) => c.onchange = () => { W.providers[c.dataset.en].enabled = c.checked; markDirty(); render(); });
  document.querySelectorAll('[data-pf]').forEach((i) => i.oninput = () => {
    const [n, k] = i.dataset.pf.split('|'), v = i.value.trim(), pr = W.providers[n];
    if (k === 'fallbackModels') { const l = v.split(',').map((x) => x.trim()).filter(Boolean); if (l.length) pr[k] = l; else delete pr[k]; }
    else if (k === 'timeoutMin') { if (Number(v) > 0) pr[k] = Number(v); else delete pr[k]; }
    else pr[k] = v;
    markDirty(); });
  document.querySelectorAll('[data-test]').forEach((b) => b.onclick = async () => {
    const n = b.dataset.test, out = document.getElementById('test-' + n);
    out.style.paddingBottom = '10px';
    b.disabled = true; out.textContent = 'Testing… (CLI agents can take a minute)';
    try { const r = await api('POST', '/api/test', { name: n, provider: W.providers[n] }); out.innerHTML = r.ok ? '<span class="pill ok">✓ responded</span>' : `<span class="pill bad">✗ ${esc(r.reason)}</span> ${esc(r.sample)}`; }
    catch (e) { out.textContent = '✗ ' + e.message; } finally { b.disabled = false; }
  });
  document.querySelectorAll('[data-del]').forEach((b) => b.onclick = () => { const n = b.dataset.del; delete W.providers[n]; for (const c of Object.values(W.roles)) { const i = c.indexOf(n); if (i >= 0) c.splice(i, 1); } markDirty(); render(); });
  const ra = $('#rt-add'); if (ra) ra.onclick = () => {
    const r = { role: $('#rt-role').value, files: $('#rt-files').value.trim(), text: $('#rt-text').value.trim(), provider: $('#rt-prov').value };
    if (!r.role && !r.files && !r.text) return toast('Fill in a role, files or text to match on');
    if (!r.provider) return toast('Enable a provider first');
    if (r.text) { try { new RegExp(r.text); } catch { return toast('Task text is not a valid regex'); } }
    for (const k of ['role', 'files', 'text']) if (!r[k]) delete r[k];
    (W.routes ||= []).push(r); markDirty(); render(); toast('Rule added. Save to keep it');
  };
  const addLib = async (ids) => {
    try { const d = await api('POST', '/api/route-templates', { providers: W.providers, routes: W.routes || [], add: ids });
      W.routes = d.routes; markDirty(); rtLibKey = ''; render();
      toast(d.added.length ? `Added ${d.added.length} rule${d.added.length > 1 ? 's' : ''}. Save to keep ${d.added.length > 1 ? 'them' : 'it'}` : d.skipped.map((x) => `${x.id}: ${x.why}`).join('; ') || 'Nothing to add');
    } catch (e) { toast(e.message); } };
  const ld = $('#rt-libd'); if (ld) ld.ontoggle = () => { rtLibOpen = ld.open; };
  const rs = $('#rt-starter'); if (rs) rs.onclick = () => addLib(rtLib.filter((t) => t.starter).map((t) => t.id));
  document.querySelectorAll('[data-rtlib]').forEach((b) => b.onclick = () => addLib([b.dataset.rtlib]));
  document.querySelectorAll('[data-rtedit]').forEach((b) => b.onclick = () => {
    const r = rtLib.find((t) => t.id === b.dataset.rtedit).route;
    $('#rt-role').value = r.role || ''; $('#rt-files').value = [].concat(r.files || []).join(', '); $('#rt-text').value = r.text || '';
    const p = [].concat(r.provider)[0]; if (p) $('#rt-prov').value = p;
    $('#rt-files').scrollIntoView({ block: 'center' }); toast('Copied into the form: change it, then Add rule');
  });
  document.querySelectorAll('[data-rtrm]').forEach((b) => b.onclick = () => { W.routes.splice(+b.dataset.rtrm, 1); markDirty(); render(); });
  document.querySelectorAll('[data-rtmv]').forEach((b) => b.onclick = () => { const [i, d] = b.dataset.rtmv.split('|').map(Number); const a = W.routes; [a[i], a[i + d]] = [a[i + d], a[i]]; markDirty(); render(); });
  document.querySelectorAll('[data-local]').forEach((b) => b.onclick = async () => {
    if (dirty) return toast('Save or discard your other changes first');
    const [id, model] = b.dataset.local.split('|');
    b.disabled = true;
    try { const r = await api('POST', '/api/providers/add', { id, model, scope: $('#scope').value }); load(r); localAt = 0; loadLocal(); toast(`${r.added.name} on with ${r.added.model}`); } catch (e) { toast(e.message); b.disabled = false; }
  });
  const pv = $('#pv-go'); if (pv) pv.onclick = async () => {
    const input = { role: $('#pv-role').value, task: $('#pv-task').value, files: $('#pv-files').value };
    try { rPreview = { ...(await api('POST', '/api/route-preview', { ...input, routes: W.routes || [], roles: W.roles })), input }; render(); } catch (e) { toast(e.message); }
  };
  document.querySelectorAll('[data-popen]').forEach((b) => b.onclick = () => { const n = b.dataset.popen; pOpen.has(n) ? pOpen.delete(n) : pOpen.add(n); render(); });
  document.querySelectorAll('[data-pall]').forEach((b) => b.onclick = () => { pAll = b.dataset.pall === '1'; render(); });
  const pa = $('#padd'); if (pa) pa.onclick = () => { pAdd = !pAdd; gOpen = null; render(); if (pAdd) $('#g-q')?.focus(); };
  // typing searches every category; a chip narrows the current search
  const gq = $('#g-q'); if (gq) gq.oninput = () => { gFilter.q = gq.value; if (gFilter.q) gFilter.cat = 'all'; applyGalleryFilter(); };
  document.querySelectorAll('[data-gcat]').forEach((b) => b.onclick = () => { gFilter.cat = b.dataset.gcat; applyGalleryFilter(); });
  document.querySelectorAll('[data-gadd]').forEach((b) => b.onclick = () => { gOpen = b.dataset.gadd; render(); $('#g-key')?.focus(); });
  document.querySelectorAll('[data-gclose]').forEach((b) => b.onclick = () => { gOpen = null; render(); });
  document.querySelectorAll('[data-gsave]').forEach((b) => b.onclick = async () => {
    if (dirty) return toast('Save or discard your other changes first');
    const fields = {}; document.querySelectorAll('[data-gfield]').forEach((i) => { fields[i.dataset.gfield] = i.value.trim(); });
    b.disabled = true; b.textContent = 'Adding…';
    try {
      const r = await api('POST', '/api/providers/add', { id: b.dataset.gsave, key: $('#g-key')?.value.trim() || undefined, fields, scope: $('#scope').value });
      gOpen = null; load(r);
      toast(`${r.added.name} added${r.added.model ? ` (${r.added.model})` : ''}. ${r.added.warning || 'Use Test on its card.'}`);
    } catch (e) { toast(e.message); b.disabled = false; b.textContent = 'Add and enable'; }
  });
  document.querySelectorAll('[data-lm]').forEach((b) => b.onclick = async () => {
    b.disabled = true; b.textContent = 'Loading…';
    try { const r = await api('POST', '/api/provider-models', { name: b.dataset.lm }); if (r.error) toast(r.error); else { provModels[b.dataset.lm] = r.models; toast(`${r.models.length} models`); } } catch (e) { toast(e.message); }
    render();
  });
  const lf = $('#loadfree'); if (lf) lf.onclick = async () => { lf.disabled = true; lf.textContent = 'Loading…'; try { freeModels = (await api('GET', '/api/models')).models; toast(`${freeModels.length} free models`); } catch (e) { toast(e.message); } render(); };
  const add = $('#np-add'); if (add) add.onclick = () => {
    const name = $('#np-name').value.trim(), type = $('#np-type').value, base = $('#np-base').value.trim();
    if (!/^[a-z0-9][a-z0-9-]*$/.test(name)) return toast('Name: lowercase letters, digits and dashes');
    if (W.providers[name]) return toast('That name exists');
    W.providers[name] = type === 'cli' ? { type, preset: base || 'opencode', enabled: true, model: $('#np-model').value.trim() }
      : { type, enabled: true, baseUrl: base, apiKeyEnv: $('#np-key').value.trim(), model: $('#np-model').value.trim() };
    markDirty(); render(); toast('Added. Put it in a role chain, then Save');
  };
  document.querySelectorAll('[data-savekey]').forEach((b) => b.onclick = async () => {
    const k = b.dataset.savekey, v = document.querySelector(`[data-key="${k}"]`).value.trim(); if (!v) return toast('Paste a key first');
    try { load(await api('PUT', '/api/secrets', { updates: { [k]: v } })); toast(`${k} saved`); } catch (e) { toast(e.message); }
  });
  document.querySelectorAll('[data-delkey]').forEach((b) => b.onclick = async () => { try { load(await api('PUT', '/api/secrets', { updates: { [b.dataset.delkey]: null } })); toast('Removed'); } catch (e) { toast(e.message); } });
  document.querySelectorAll('input[name=ctrl]').forEach((r) => r.onchange = () => { ctrlPick = r.value; render(); });
  const ap = $('#apply-ctrl'); if (ap) ap.onclick = async () => {
    ap.disabled = true;
    try {
      const r = await api('POST', '/api/init', { controller: ctrlPick || S.effective.controller, mcp: $('#ctrl-mcp').checked });
      const out = r.lines.join('\n') + (r.notes.length ? '\n\n' + r.notes.join('\n') : '');
      S = r.state; W.controller = S.effective.controller; ctrlPick = null; render();
      const pre = $('#init-out'); pre.style.display = 'block'; pre.textContent = out; toast('Project updated');
    } catch (e) { toast(e.message); ap.disabled = false; }
  };
  document.querySelectorAll('[data-set]').forEach((i) => i.oninput = () => { const f = Number(i.dataset.factor || 1); W.settings[i.dataset.set] = f === 1 ? Number(i.value) : Math.round(Number(i.value) * f); markDirty(); });
  document.querySelectorAll('[data-sets]').forEach((i) => i.oninput = () => { W.settings[i.dataset.sets] = i.value; markDirty(); });
  document.querySelectorAll('[data-setl]').forEach((i) => i.oninput = () => { W.settings[i.dataset.setl] = i.value.split(',').map((x) => x.trim()).filter(Boolean); markDirty(); });
  document.querySelectorAll('[data-setb]').forEach((i) => i.onchange = () => { W.settings[i.dataset.setb] = i.checked; markDirty(); });
}

(async () => {
  try { const sc = localStorage.getItem('conductor-scope'); if (sc) $('#scope').value = sc; } catch {}
  if (!TOKEN) { $('#main').innerHTML = '<div class="err">Missing access token. Open the full URL printed by <span class="mono">conductor ui</span>.</div>'; return; }
  try { const st = await api('GET', '/api/state'); if (!st.hasProjectConfig && !localStorage.getItem('conductor-scope')) $('#scope').value = 'global'; load(st); }
  catch (e) { $('#main').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
})();
window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
</script>
</body>
</html>
