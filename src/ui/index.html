<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>conductor</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cg fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round'%3E%3Cpath d='M8 25 L19 9'/%3E%3Cpath d='M6 16h3M23 16h3M16 23v3'/%3E%3C/g%3E%3Ccircle cx='21' cy='7' r='2.6' fill='white'/%3E%3C/svg%3E">
<meta name="theme-color" content="#4f46e5">
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f1f3f6; --text: #16181d; --muted: #5d6573; --line: #e2e5ea;
  --accent: #4f46e5; --accent-ink: #ffffff; --accent-soft: #eef0ff;
  --ok: #15803d; --ok-soft: #e7f6ec; --bad: #b42318; --bad-soft: #fdecea; --warn: #a15c07; --warn-soft: #fdf3e2;
  --local: #0e7490; --local-soft: #e3f5f8; --cloud: #7c3aed; --cloud-soft: #f1ebfe;
  --radius: 10px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --text: #e7e9ee; --muted: #9aa3b2; --line: #2a2f3a;
    --accent: #818cf8; --accent-ink: #0f1115; --accent-soft: #23264a;
    --ok: #4ade80; --ok-soft: #12291b; --bad: #f87171; --bad-soft: #2d1515; --warn: #fbbf24; --warn-soft: #2b2110;
    --local: #22d3ee; --local-soft: #0c2a30; --cloud: #c4b5fd; --cloud-soft: #241a3d; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --text: #e7e9ee; --muted: #9aa3b2; --line: #2a2f3a;
  --accent: #818cf8; --accent-ink: #0f1115; --accent-soft: #23264a;
  --ok: #4ade80; --ok-soft: #12291b; --bad: #f87171; --bad-soft: #2d1515; --warn: #fbbf24; --warn-soft: #2b2110;
  --local: #22d3ee; --local-soft: #0c2a30; --cloud: #c4b5fd; --cloud-soft: #241a3d; --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
a { color: var(--accent); }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 12px; padding: 10px 20px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 16px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.brand svg { color: var(--accent); }
.proj { color: var(--muted); font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46ch; }
.spacer { flex: 1; }
.layout { display: grid; grid-template-columns: 184px minmax(0, 1fr); gap: 0; max-width: 1200px; margin: 0 auto; }
nav { padding: 16px 12px; position: sticky; top: 57px; align-self: start; }
nav button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; color: var(--muted); padding: 8px 12px; border-radius: 8px; font: inherit; cursor: pointer; }
nav button:hover { background: var(--panel-2); color: var(--text); }
nav button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
main { padding: 20px; min-width: 0; }
h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.01em; }
h2 { font-size: 15px; margin: 0 0 10px; }
.sub { color: var(--muted); margin: 0 0 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.stat .n { font-size: 26px; font-weight: 700; }
.stat .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 6px 12px; border-radius: 8px; font: inherit; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.small { padding: 3px 8px; font-size: 12px; }
.btn.icon { padding: 3px 7px; }
.btn:disabled { opacity: .45; cursor: default; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.mini { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--panel-2); }
.mini .note { display: block; margin-top: 6px; }
input[type=text], input[type=search], input[type=password], input[type=number], select, textarea { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font: inherit; width: 100%; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
label.f { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 1px 8px; border-radius: 99px; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.local-agent, .pill.local-model { background: var(--local-soft); color: var(--local); } .pill.cloud-api { background: var(--cloud-soft); color: var(--cloud); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); flex: none; } .dot.ok { background: var(--ok); }
.chain { display: flex; flex-direction: column; gap: 4px; margin: 10px 0; }
.link { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: center; padding: 4px 6px 4px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); }
.link .idx { color: var(--muted); font-size: 12px; text-align: center; }
.link .nm { display: flex; gap: 8px; align-items: center; min-width: 0; white-space: nowrap; overflow: hidden; }
.chainline { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chainline .arrow { color: var(--muted); }
.gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; margin-top: 12px; }
.gcard { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--panel-2); display: flex; flex-direction: column; gap: 4px; }
.gcard.open { grid-column: 1 / -1; border-color: var(--accent); }
.gcard .note { margin: 0; }
.gcard .warn { color: var(--warn); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 999px; padding: 3px 10px; font: inherit; font-size: 12.5px; cursor: pointer; }
.chip.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
.btn svg.i { width: 14px; height: 14px; }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); } .btn.ghost:hover { background: var(--panel-2); color: var(--text); }
.head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; } .head h1 { margin: 0; } .head .sub { margin: 2px 0 0; flex-basis: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; } .seg button { border: 0; background: var(--panel); color: var(--muted); padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; } .seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.plist { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 14px; }
.prow { border-bottom: 1px solid var(--line); } .prow:last-child { border-bottom: 0; }
.prow-main { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 14px; }
.prow-name { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; } .prow-name b { font-size: 14px; }
.prow-model { color: var(--muted); font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 28ch; }
.prow-body { padding: 0 14px 14px 60px; } .prow.open { background: var(--panel-2); }
.chev { transition: transform .15s; } .prow.open .chev { transform: rotate(180deg); }
.kind { color: var(--muted); display: inline-flex; } .kind svg.i { width: 14px; height: 14px; }
.roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; } .roles .card { margin: 0; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); } .status.bad { color: var(--bad); }
details.more > summary { cursor: pointer; color: var(--muted); font-size: 13px; list-style: none; display: flex; align-items: center; gap: 6px; } details.more > summary::-webkit-details-marker { display: none; }
details.more[open] > summary { margin-bottom: 10px; }
.prov { display: grid; grid-template-columns: auto 1fr; gap: 12px; }
.prov-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.prov-head b { font-size: 14.5px; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-top: 10px; }
.note { color: var(--muted); font-size: 12.5px; }
.explain { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--panel-2); font-size: 13px; line-height: 1.5; }
.explain ol { margin: 4px 0 0; padding-left: 20px; } .explain li { margin: 2px 0; }
.lib { display: grid; gap: 8px; } .lib .item { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.lib .item .row { gap: 6px; } .lib .item .note { display: block; margin-top: 2px; }
.switch { position: relative; width: 34px; height: 20px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 99px; cursor: pointer; transition: .15s; }
.switch span::after { content: ""; position: absolute; width: 14px; height: 14px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
.switch input:checked + span { background: var(--accent); } .switch input:checked + span::after { transform: translateX(14px); }
.ctrl { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.ctrl label { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; cursor: pointer; background: var(--panel); display: block; }
.ctrl input { margin-right: 6px; } .ctrl label.sel { border-color: var(--accent); background: var(--accent-soft); }
pre.cmd { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 44px 8px 10px; margin: 6px 0; overflow-x: auto; font-family: var(--mono); font-size: 12.5px; position: relative; white-space: pre-wrap; word-break: break-all; }
.copy { position: absolute; top: 5px; right: 5px; }
table { width: 100%; border-collapse: collapse; }
td, th { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
.savebar { position: sticky; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 10px 20px; display: none; align-items: center; gap: 10px; flex-wrap: wrap; z-index: 5; }
.savebar.show { display: flex; }
#toast { position: fixed; right: 16px; bottom: 70px; background: var(--text); color: var(--bg); padding: 9px 14px; border-radius: 8px; opacity: 0; transition: .2s; pointer-events: none; max-width: 80vw; z-index: 10; }
#toast.show { opacity: 1; }
.err { background: var(--bad-soft); color: var(--bad); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; }
.steps { counter-reset: s; list-style: none; padding: 0; margin: 0; }
.steps > li { counter-increment: s; position: relative; padding-left: 36px; margin-bottom: 16px; }
.steps > li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; display: grid; place-items: center; font-size: 12px; }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  nav { position: static; display: flex; overflow-x: auto; gap: 4px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  nav button { width: auto; white-space: nowrap; padding: 6px 10px; }
  .prow-body { padding-left: 14px; } .prow-model { display: none; }
  main { padding: 16px; }
  .bar { padding: 10px 16px; gap: 8px; } .bar label[for=scope] { display: none; } #scope { max-width: 150px; font-size: 13px; padding: 4px 6px; }
  .proj { max-width: 100%; order: 5; flex-basis: 100%; }
  table { display: block; overflow-x: auto; }
  td input[type=password] { min-width: 140px; }
}
.sub .mono, td.mono { word-break: break-all; }
body { overflow-x: hidden; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20 L14 6"/><circle cx="16" cy="4.5" r="2"/><path d="M3 12h3M18 12h3M12 18v3"/></svg>
      conductor
    </div>
    <span class="proj" id="proj"></span>
    <span class="spacer"></span>
    <label class="note" for="scope">Save to</label>
    <select id="scope" style="width:auto">
      <option value="global">Global (all projects)</option>
      <option value="project">This project only</option>
    </select>
    <button class="btn icon ghost" id="theme" title="Toggle theme" aria-label="Toggle theme"></button>
  </div>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"><p class="note">Loading…</p></main>
</div>
<div class="savebar" id="savebar">
  <b>Unsaved changes</b><span class="note" id="savewhere"></span><span class="spacer"></span>
  <button class="btn" id="discard">Discard</button>
  <button class="btn primary" id="save">Save</button>
</div>
<div id="toast" role="status"></div>
<script>
const TOKEN = new URLSearchParams(location.hash.slice(1)).get('t') || '';
// small stroke icons (24x24 paths), drawn for this page
const ICONS = {
  overview: 'M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z',
  runs: 'M22 12h-4l-3 8L9 4l-3 8H2',
  roles: 'M6 3v12M18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 9a9 9 0 0 1-9 9',
  providers: 'M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0zM12 18v4',
  keys: 'M15.5 7.5l3 3M21 2l-9.6 9.6M14 9l7-7M7.5 21a5.5 5.5 0 1 0 0-11 5.5 5.5 0 0 0 0 11z',
  settings: 'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6',
  setup: 'M12 3v12M7 10l5 5 5-5M5 21h14',
  test: 'M6 4l14 8-14 8z', guide: 'M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5zM4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5',
  list: 'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01', chev: 'M6 9l6 6 6-6', plus: 'M12 5v14M5 12h14', x: 'M18 6L6 18M6 6l12 12',
  up: 'M12 19V5M5 12l7-7 7 7', down: 'M12 5v14M19 12l-7 7-7-7', agent: 'M4 17l6-6-6-6M12 19h8', cloud: 'M18 10h-1.3A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z',
  chip: 'M5 5h14v14H5zM9 9h6v6H9zM9 1v4M15 1v4M9 19v4M15 19v4M1 9h4M1 15h4M19 9h4M19 15h4',
  sun: 'M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4',
  moon: 'M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z', copy: 'M9 9h11v11H9zM5 15H4V4h11v1',
};
const icon = (n, t = '') => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"${t ? ` title="${t}"` : ''}><path d="${ICONS[n]}"/></svg>`;
const TABS = [['overview', 'Overview'], ['runs', 'Runs'], ['roles', 'Roles'], ['providers', 'Providers'], ['keys', 'API keys'], ['settings', 'Settings'], ['setup', 'Setup']];
let S = null, W = null, tab = 'overview', dirty = false, freeModels = null, runsData = null, gOpen = null, gFilter = { q: '', cat: 'all' };
let rPreview = null; // routing preview result
let rtLib = null, rtLibKey = '', rtLibOpen = null; // rule library, resolved against the current (unsaved) providers
const ROUTING_GUIDE = 'https://github.com/KevalParikh22/conductor-ai/blob/main/docs/ROUTING.md';
function loadRtLib() {
  const key = JSON.stringify([Object.keys(W.providers).filter((n) => W.providers[n].enabled), (W.routes || []).map((r) => r.from)]);
  if (key === rtLibKey) return; rtLibKey = key;
  api('POST', '/api/route-templates', { providers: W.providers, routes: W.routes || [] }).then((d) => { rtLib = d.templates; if (tab === 'roles') render(); }, () => {});
}
let localInfo = null, localAt = 0; // local model servers, refreshed at most every 30s
function loadLocal() { if (Date.now() - localAt < 30000) return; localAt = Date.now(); api('GET', '/api/local').then((d) => { localInfo = d.local; if (tab === 'providers' || tab === 'setup') render(); }, () => {}); }
let pAll = false, pAdd = false; const pOpen = new Set(); // providers page: show disabled, gallery open, expanded rows
const provModels = {};
const GUIDE = (id) => `https://github.com/KevalParikh22/conductor-ai/blob/main/docs/providers/${id}.md`;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = (x) => JSON.parse(JSON.stringify(x));

try { const t = localStorage.getItem('conductor-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
const curTheme = () => document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
const themeIcon = () => { $('#theme').innerHTML = icon(curTheme() === 'dark' ? 'sun' : 'moon'); };
themeIcon();
$('#theme').onclick = () => {
  const next = curTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next; themeIcon();
  try { localStorage.setItem('conductor-theme', next); } catch {}
};

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { 'content-type': 'application/json', 'x-conductor-token': TOKEN }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }
function markDirty() { dirty = true; $('#savebar').classList.add('show'); $('#savewhere').textContent = ' → ' + ($('#scope').value === 'global' ? 'global config (all projects)' : 'this project'); }
function load(state) { S = state; W = clone(S.effective); dirty = false; $('#savebar').classList.remove('show'); $('#proj').textContent = S.root; render(); }

$('#save').onclick = async () => {
  try { load(await api('PUT', '/api/config', { scope: $('#scope').value, effective: W })); toast('Saved'); }
  catch (e) { toast('Not saved: ' + e.message); }
};
$('#discard').onclick = () => load(S);
$('#scope').onchange = () => { if (dirty) markDirty(); try { localStorage.setItem('conductor-scope', $('#scope').value); } catch {} };

function renderNav() {
  $('#nav').innerHTML = TABS.map(([k, l]) => `<button data-tab="${k}" class="${k === tab ? 'active' : ''}">${icon(k)}${l}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach((b) => b.onclick = () => { tab = b.dataset.tab; render(); });
}
function provStatus(name) { return S.status.providers.find((p) => p.name === name) || { ready: false, reason: 'unknown' }; }
function locPill(p) { const l = p.location || 'cloud-api'; return `<span class="pill ${l}">${{ 'local-agent': 'local agent', 'local-model': 'local model', 'cloud-api': 'cloud API' }[l]}</span>`; }
function readyPill(name) { const st = provStatus(name); const w = W.providers[name]; if (w && !w.enabled) return '<span class="pill">disabled</span>'; return st.ready ? '<span class="pill ok">ready</span>' : `<span class="pill bad">${esc(st.reason)}</span>`; }
// short status for tight rows; the full reason is in the title
const shortReason = (r) => /not set/.test(r) ? 'no key' : /not installed/.test(r) ? 'not installed' : r.length > 22 ? r.slice(0, 20) + '…' : r;
function copyBtn(text) { return `<button class="btn small copy" data-copy="${esc(text)}" title="Copy">${icon('copy')}</button>`; }
function cmd(text) { return `<pre class="cmd">${esc(text)}${copyBtn(text)}</pre>`; }
function bindCopy() { document.querySelectorAll('[data-copy]').forEach((b) => b.onclick = () => { navigator.clipboard?.writeText(b.dataset.copy).then(() => toast('Copied'), () => toast('Copy failed')); }); }

function loadRuns() { api('GET', '/api/runs').then((d) => { runsData = d; if (tab === 'runs') render(); }, (e) => toast(e.message)); }
// keep the Runs page current while it is open (runs started from the terminal show up on their own)
setInterval(() => { if (tab === 'runs' && document.visibilityState === 'visible') loadRuns(); }, 5000);

const GCATS = [['all', 'All'], ['free', 'Free'], ['aggregator', 'Gateways'], ['frontier', 'Model makers'], ['fast', 'Fast hosts'], ['cloud', 'Cloud'], ['local', 'Local']];
const gMatch = (c) => (gFilter.cat === 'all' || c.category === gFilter.cat || (gFilter.cat === 'free' && !!c.free))
  && (!gFilter.q || `${c.id} ${c.label} ${c.about} ${c.free || ''}`.toLowerCase().includes(gFilter.q.toLowerCase()));

        <a class="note" href="${GUIDE(c.id)}" target="_blank" rel="noopener">guide</a></div>
      <p class="note">${esc(c.about)}</p>
      ${c.free ? `<p class="note"><b>Free:</b> ${esc(c.free.replace(/^Free:\s*/i, ''))}</p>` : ''}
      ${c.privacy ? `<p class="note warn">${esc(c.privacy)}</p>` : ''}
      ${open ? `<div class="fields" style="margin-top:6px">
          ${c.apiKeyEnv && !c.apiKeyOptional && !c.keySet ? `<div><label class="f">${esc(c.apiKeyEnv)} · <a href="${esc(c.keyUrl)}" target="_blank" rel="noopener">get a key</a></label><input type="password" id="g-key" placeholder="paste key" autocomplete="off"></div>` : `<div class="note">${c.apiKeyEnv && !c.apiKeyOptional ? `${esc(c.apiKeyEnv)} is set.` : c.apiKeyEnv ? 'No key needed to start.' : 'No key needed.'}</div>`}
          ${c.fields.map((f) => `<div><label class="f">${esc(f.replaceAll('_', ' ').toLowerCase())}</label><input type="text" data-gfield="${esc(f)}"></div>`).join('')}
        </div><div class="row" style="margin-top:8px"><button class="btn primary small" data-gsave="${esc(c.id)}">Add and enable</button><button class="btn small" data-gclose>Cancel</button>
          <span class="note">Saved to ${$('#scope')?.value === 'project' ? 'this project' : 'global config'}; added to the docs, test, review and ask roles. The key goes to the secrets file.</span></div>`
        : `<div class="row" style="margin-top:4px">${c.enabled ? '<span class="note">Added: see your list.</span>' : `<button class="btn small" data-gadd="${esc(c.id)}">${c.added ? 'Enable' : 'Add'}</button>`}</div>`}

  return `<div class="card"><h2>Add a provider <span class="note">${S.catalog.length} available, ${S.catalog.filter((c) => c.free).length} with a free tier</span></h2>
    <div class="row" style="gap:10px;flex-wrap:wrap"><input type="search" id="g-q" placeholder="Search: groq, coding, free…" value="${esc(gFilter.q)}" style="max-width:260px">
      <div class="chips">${GCATS.map(([k, l]) => `<button class="chip ${gFilter.cat === k ? 'on' : ''}" data-gcat="${k}">${l}</button>`).join('')}</div><span class="note" id="g-count">${S.catalog.filter(gMatch).length} shown</span></div>
    <div class="gal">${S.catalog.map(card).join('')}</div>
    <p class="note" id="g-none" ${S.catalog.some(gMatch) ? 'hidden' : ''}>Nothing matches. Any OpenAI-compatible endpoint works: add it as a custom provider below.</p>
    <details class="more" style="margin-top:12px"><summary>${icon('plus')} Custom provider (any OpenAI-compatible endpoint or another CLI agent)</summary>
      <div class="fields"><div><label class="f">Name</label><input type="text" id="np-name" placeholder="e.g. company-gateway"></div>
      <div><label class="f">Type</label><select id="np-type"><option value="openai">OpenAI-compatible API</option><option value="anthropic">Anthropic API</option><option value="cli">CLI agent</option></select></div>
      <div><label class="f">Base URL / CLI preset</label><input type="text" id="np-base" placeholder="https://api.example.com/v1  or  codex, grok, aider…"></div>
      <div><label class="f">API key env var</label><input type="text" id="np-key" placeholder="EXAMPLE_API_KEY"></div>
      <div><label class="f">Model</label><input type="text" id="np-model"></div></div>
      <div class="row" style="margin-top:10px"><button class="btn" id="np-add">Add</button></div></details></div>`;

// local model servers found on this machine: one line each, with Enable when there is a chat model
function localBanner() {
  loadLocal();
  const seen = (localInfo || []).filter((l) => l.running || l.installed);
  if (!seen.length) return '';
  return `<div class="card"><div class="row"><h2 style="margin:0">${icon('chip')} Local models</h2><span class="note">Free and private: nothing leaves this machine.</span></div>
    ${seen.map((l) => { const name = Object.entries(W.providers).find(([, p]) => p.catalog === l.id)?.[0] || l.id; const p = W.providers[name]; const on = p?.enabled && l.models.includes(p.model);
      return `<div class="row" style="margin-top:8px"><span class="dot ${l.running ? 'ok' : ''}"></span><b>${esc(l.label)}</b>
        <span class="note">${l.running ? `${l.models.length} model${l.models.length === 1 ? '' : 's'}${l.best ? ` · best for code: <span class="mono">${esc(l.best)}</span>` : ''}` : 'installed, not running'}</span><span class="spacer"></span>
        ${on ? `<span class="pill ok">on · ${esc(p.model)}</span>` : l.running && l.best ? `<button class="btn small primary" data-local="${esc(l.id)}|${esc(l.best)}">Enable</button>` : ''}</div>
        ${l.next ? `<div class="note" style="margin-left:16px">${esc(l.next.split(': ')[0])}: ${cmd(l.next.split(': ').slice(1).join(': '))}</div>` : ''}`; }).join('')}</div>`;
}

function applyGalleryFilter() {
  document.querySelectorAll('[data-gid]').forEach((el) => { el.hidden = !gMatch(S.catalog.find((c) => c.id === el.dataset.gid)); });
  document.querySelectorAll('[data-gcat]').forEach((b) => b.classList.toggle('on', b.dataset.gcat === gFilter.cat));
  const none = $('#g-none'); if (none) none.hidden = S.catalog.some(gMatch);
  const n = $('#g-count'); if (n) n.textContent = `${S.catalog.filter(gMatch).length} shown`;
}

const views = {
  runs() {
    if (!runsData) { loadRuns(); return '<div class="head"><h1>Runs</h1><p class="sub">Loading…</p></div>'; }
    const { runs, usage, budget } = runsData;
    const money = (n) => (n == null ? '–' : n ? `$${n.toFixed(n < 0.01 ? 4 : 2)}` : '$0');
    const result = (r) => r.state === 'running' ? '<span class="pill warn">running</span>' : r.state === 'done' ? '<span class="pill ok">done</span>' : '<span class="pill bad">failed</span>';
    const verify = (v) => !v ? '–' : `<span class="pill ${v === 'PASS' ? 'ok' : v === 'FAIL' ? 'bad' : ''}">${esc(v)}</span>`;
    return `<div class="head"><h1>Runs</h1><p class="sub">Work handed out in this project, newest first; updates every few seconds (<span class="mono">conductor runs</span> in the terminal).</p></div>
    <div class="grid">
      <div class="card stat"><div class="l">Runs (last ${usage.days} days, all projects)</div><div class="n">${usage.rows.reduce((t, r) => t + r.runs, 0)}</div></div>
      <div class="card stat"><div class="l">Tokens saved (estimate)</div><div class="n">${usage.savings?.total ? `~${usage.savings.total.toLocaleString()}` : '<span class="note" style="font-size:16px">none yet</span>'}</div><div class="note">${usage.savings?.total ? `controller ~${usage.savings.controller.toLocaleString()} · workers ~${usage.savings.workers.toLocaleString()}${usage.savings.freeRuns ? ` · ${usage.savings.freeRuns} task${usage.savings.freeRuns === 1 ? '' : 's'} moved to free models` : ''}` : 'compact diffs, trimmed reports and free-model picks'}</div></div>
      <div class="card stat"><div class="l">Known API cost today</div><div class="n">${money(usage.today)}</div><div class="note">${budget ? `daily budget ${money(budget)}` : 'no daily budget (Settings)'}</div></div>
    </div>
    <div class="card"><h2>Recent runs</h2>${runs.length ? `<table><tr><th>When</th><th>Role · task</th><th>Result</th><th>Worker</th><th>Verify</th><th>Files</th><th>Time</th></tr>
      ${runs.map((r) => `<tr><td class="mono">${esc(r.startedAt ? new Date(r.startedAt).toLocaleString() : r.id)}</td>
        <td><b>${esc(r.role)}</b>${r.task ? ` · ${esc(r.task)}` : ''}${r.branch ? `<div class="note mono">${esc(r.branch)}</div>` : ''}</td>
        <td>${result(r)}</td>
        <td>${esc(r.winner || '–')}${r.why ? `<div class="note">${esc(r.why)}</div>` : ''}${r.attempts?.length > 1 ? `<div class="note">${r.attempts.map((a) => `${esc(a.provider)} ${a.ok ? '✓' : '✗'}`).join(' → ')}</div>` : ''}</td>
        <td>${verify(r.verify)}</td><td>${r.changed ?? '–'}</td><td>${r.seconds != null ? `${r.seconds}s` : ''}</td></tr>
        ${r.warnings?.length ? `<tr><td></td><td colspan="6">${r.warnings.map((w) => `<div class="note">⚠ ${esc(w)}</div>`).join('')}</td></tr>` : ''}`).join('')}
      </table>` : '<p class="note">No runs yet. They appear here when your controller hands out work (<span class="mono">conductor run …</span>).</p>'}</div>
    <div class="card"><h2>Usage by provider</h2><p class="note">Last ${usage.days} days, all projects. CLI agents run on your subscriptions, so they show runs and time; API providers also show tokens and, when a price is set, cost.</p>
      ${usage.rows.length ? `<table><tr><th>Provider</th><th>Runs</th><th>Succeeded</th><th>Tokens in / out</th><th>Cost</th><th>Time</th></tr>
      ${usage.rows.map((u) => `<tr><td>${esc(u.provider)}</td><td>${u.runs}</td><td>${u.ok}</td><td>${u.input || u.output ? `${u.input.toLocaleString()} / ${u.output.toLocaleString()}` : '–'}</td><td>${u.subscription ? '<span class="note">subscription</span>' : u.cost ? money(u.cost) : u.costKnown ? '$0' : '? (no price)'}</td><td>${Math.round(u.seconds / 60)} min</td></tr>`).join('')}</table>` : '<p class="note">Nothing recorded yet.</p>'}</div>`;
  },
  overview() {
    const st = S.status; const ready = st.providers.filter((p) => p.ready).length; const enabled = st.providers.filter((p) => p.enabled).length;
    const cds = Object.entries(S.cooldowns);
    return `<div class="head"><h1>Overview</h1><p class="sub">${esc(S.controllers[W.controller]?.label || W.controller)} plans and reviews; the providers below do the work, in fallback order.</p></div>
    ${S.errors.length ? `<div class="err">Config problems: ${S.errors.map(esc).join('; ')}</div>` : ''}
    <div class="grid">
      <div class="card stat"><div class="l">Controller</div><div class="n" style="font-size:18px">${esc(S.controllers[W.controller]?.label || W.controller)}</div><div class="note">Change in Settings</div></div>
      <div class="card stat"><div class="l">Providers ready</div><div class="n">${ready}<span class="note" style="font-size:14px"> / ${enabled} enabled</span></div></div>
      <div class="card stat"><div class="l">Repo</div><div class="n" style="font-size:16px">${st.repo ? esc(st.repo.branch) : 'not a git repo'}</div><div class="note">${st.repo ? (st.repo.dirty ? 'uncommitted changes' : 'clean') + (st.repo.failedStashes ? ` · ${st.repo.failedStashes} failed-attempt stash(es)` : '') : 'write roles need git'}</div></div>
      <div class="card stat"><div class="l">Verify command</div><div class="mono" style="margin-top:6px">${esc(st.verify || 'none detected')}</div></div>
    </div>
    <div class="card"><h2>Who does what</h2>
      <table><tr><th>Role</th><th>Fallback chain</th></tr>
      ${Object.entries(W.roles).map(([r, chain]) => `<tr><td><b>${esc(S.roles[r]?.label || r)}</b> ${S.roles[r]?.mode === 'read' ? '<span class="pill">read-only</span>' : ''}</td><td><div class="chainline">${chain.map((n, i) => `${i ? '<span class="arrow">→</span>' : ''}<span class="pill"><span class="dot ${provStatus(n).ready && W.providers[n]?.enabled ? 'ok' : ''}"></span>${esc(n)}</span>`).join('')}</div></td></tr>`).join('')}
      </table></div>
    ${cds.length ? `<div class="card"><h2>Cooling down (rate-limited)</h2>${cds.map(([n, c]) => `<div class="row" style="margin-bottom:6px"><b>${esc(n)}</b><span class="note">until ${new Date(c.until).toLocaleTimeString()}</span><button class="btn small" data-clear="${esc(n)}">clear</button></div>`).join('')}</div>` : ''}
    ${!S.hasProjectConfig && S.inRepo ? `<div class="card"><h2>This project isn't set up yet</h2><p class="note">Add the rules file, controller commands and plan template to <span class="mono">${esc(S.root)}</span>.</p><button class="btn primary" data-goto="settings">Set up this project</button></div>` : ''}`;
  },
  roles() {
    const names = Object.keys(W.providers);
    const kindIcon = (n) => { const l = provStatus(n).location || (W.providers[n]?.type === 'cli' ? 'local-agent' : 'cloud-api');
      return `<span class="kind" title="${{ 'local-agent': 'local agent', 'local-model': 'local model', 'cloud-api': 'cloud API' }[l]}">${icon(l === 'local-agent' ? 'agent' : l === 'local-model' ? 'chip' : 'cloud')}</span>`; };
    const st = (n) => { const p = W.providers[n], s = provStatus(n);
      if (!p) return '<span class="status bad">unknown</span>';
      if (!p.enabled) return '<span class="status">off</span>';
      return s.ready ? '<span class="status"><span class="dot ok"></span></span>' : `<span class="status bad" title="${esc(s.reason)}"><span class="dot"></span>${esc(shortReason(s.reason))}</span>`; };
    const routes = W.routes || [];
    loadRtLib();
    const roleOpts = (sel = '') => `<option value="">any role</option>${Object.keys(S.roles).map((r) => `<option value="${r}" ${sel === r ? 'selected' : ''}>${esc(S.roles[r].label)}</option>`).join('')}`;
    const when = (r) => [r.role && `<span class="pill">${esc(S.roles[r.role]?.label || r.role)}</span>`, r.files && `files <span class="mono">${esc([].concat(r.files).join(', '))}</span>`, r.text && `text <span class="mono">/${esc(r.text)}/</span>`].filter(Boolean).join(' + ');
    return `<div class="head"><h1>Roles</h1><p class="sub">Each role tries its providers top to bottom; when one is rate-limited, fails or isn't installed, the next runs. If all fail, the controller does the task.</p></div>
    <div class="card"><div class="row"><h2 style="margin:0">Routing</h2><span class="note">You decide which provider takes which kind of task.</span><span class="spacer"></span><a class="btn small ghost" href="${ROUTING_GUIDE}" target="_blank" rel="noopener">${icon('guide')} Routing guide</a></div>
      <div class="explain"><b>How it works</b><ol>
        <li>A rule matches a task by its <b>files</b> (a glob like <span class="mono">*.sql</span>), its <b>text</b> (a regex like <span class="mono">login|payment</span>) or its <b>role</b>. Every condition you fill in must hold.</li>
        <li>When a task matches, the rule's providers run <b>first</b>. The role's chain stays behind them, so a rate limit or failure still falls back.</li>
        <li>Rules are checked top to bottom and the <b>first match wins</b>: keep risky rules (security, database) at the top. A plan task's <span class="mono">provider:</span> line beats every rule; tasks no rule matches go to the smart selector.</li>
      </ol><span class="note">Not sure where to start? Add the starter set from the rule library below, then try a task in Preview.</span></div>
      ${routes.length ? `<table style="margin-top:8px"><tr><th>#</th><th>When</th><th>Goes to</th><th></th></tr>${routes.map((r, i) => `<tr><td class="note">${i + 1}</td><td>${when(r) || 'any task'}${r.from ? ` <span class="note">· ${esc(r.from)}</span>` : ''}</td><td><b>${esc([].concat(r.provider).join(', '))}</b></td><td style="text-align:right"><button class="btn icon ghost small" data-rtmv="${i}|-1" ${i ? '' : 'disabled'} aria-label="Move up">${icon('up')}</button><button class="btn icon ghost small" data-rtrm="${i}" aria-label="Remove">${icon('x')}</button></td></tr>`).join('')}</table>` : '<p class="note">No rules yet. Without them the smart selector orders each chain.</p>'}
      <details class="more" id="rt-libd" style="margin-top:14px" ${(rtLibOpen ?? !routes.length) ? 'open' : ''}><summary>${icon('list')} Rule library: ${rtLib ? rtLib.length : ''} ready-made rules</summary>
        ${rtLib ? `<div class="row" style="margin-bottom:8px"><button class="btn small primary" id="rt-starter" ${rtLib.filter((t) => t.starter && !t.added && !t.missing).length ? '' : 'disabled'}>${icon('plus')} Add starter set</button><span class="note">★ rules: security, database, infrastructure, small edits, docs. Providers are filled in from the ones you have on.</span></div>
        <div class="lib">${rtLib.map((t) => `<div class="item"><div class="row"><b>${t.starter ? '★ ' : ''}${esc(t.label)}</b><span class="spacer"></span>
          ${t.added ? '<span class="pill ok">added</span>' : t.missing ? `<span class="note">${esc(t.missing)}</span>` : `<button class="btn small" data-rtlib="${esc(t.id)}">${icon('plus')} Add</button>`}
          <button class="btn small ghost" data-rtedit="${esc(t.id)}" title="Copy into the form below to change it first">Customize</button></div>
          <span class="note">${esc(t.why)}</span>
          <span class="note">${when(t.route) || 'any task'} → <b>${esc([].concat(t.route.provider).join(', ') || t.want)}</b></span></div>`).join('')}</div>` : '<p class="note">Loading…</p>'}
      </details>
      <h3 style="margin:16px 0 0;font-size:14px">Write your own rule</h3>
      <div class="fields" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))"><div><label class="f">Role</label><select id="rt-role">${roleOpts()}</select></div>
        <div><label class="f">Files (glob)</label><input type="text" id="rt-files" placeholder="src/frontend/**"></div>
        <div><label class="f">Task text (regex)</label><input type="text" id="rt-text" placeholder="migration|schema"></div>
        <div><label class="f">Provider</label><select id="rt-prov">${Object.keys(W.providers).filter((n) => W.providers[n].enabled).map((n) => `<option>${esc(n)}</option>`).join('')}</select></div></div>
      <div class="row" style="margin-top:10px"><button class="btn small" id="rt-add">${icon('plus')} Add rule</button><span class="note">Fill in at least one condition. <b>Files</b>: comma-separated globs, <span class="mono">**</span> spans folders and <span class="mono">*.sql</span> matches in any folder. <b>Task text</b>: a regex on the task description, case ignored. The new rule goes to the bottom; move it up with ↑. Save to keep it.</span></div>
      <details class="more" style="margin-top:14px" ${rPreview ? 'open' : ''}><summary>${icon('test')} Preview: which providers would take a task?</summary>
        <div class="fields" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))"><div><label class="f">Role</label><select id="pv-role">${Object.keys(S.roles).map((r) => `<option value="${r}" ${rPreview?.input?.role === r ? 'selected' : ''}>${esc(S.roles[r].label)}</option>`).join('')}</select></div>
          <div style="grid-column:span 2"><label class="f">Task</label><input type="text" id="pv-task" placeholder="e.g. add a date picker to the booking form" value="${esc(rPreview?.input?.task || '')}"></div>
          <div><label class="f">Files</label><input type="text" id="pv-files" placeholder="src/frontend/Booking.tsx" value="${esc(rPreview?.input?.files || '')}"></div></div>
        <div class="row" style="margin-top:8px"><button class="btn small" id="pv-go">Preview</button>${rPreview ? `<span class="note">${esc({ plan: 'set by the plan', route: 'routing rule', selector: 'smart selector', role: "role's chain" }[rPreview.how] || rPreview.how)}${rPreview.note ? `: ${esc(rPreview.note)}` : ''}</span>` : ''}</div>
        ${rPreview ? `<div class="chainline" style="margin-top:8px">${rPreview.chain.map((c, i) => `${i ? '<span class="arrow">→</span>' : ''}<span class="pill" title="${esc(c.skip || 'ready')}"><span class="dot ${c.skip ? '' : 'ok'}"></span>${esc(c.name)}</span>`).join('')}</div>` : ''}

    <div class="roles">${Object.entries(W.roles).map(([r, chain]) => `<div class="card"><div class="row"><h2 style="margin:0">${esc(S.roles[r]?.label || r)}</h2>${S.roles[r]?.mode === 'read' ? '<span class="pill">read-only</span>' : '<span class="pill warn">edits files</span>'}</div>
      <div class="note">${esc(S.roles[r]?.description || '')}</div>
      <div class="chain">${chain.map((n, i) => `<div class="link"><span class="idx">${i + 1}</span><span class="nm">${kindIcon(n)}<b>${esc(n)}</b>${st(n)}</span>
        <span class="row" style="gap:2px"><button class="btn icon ghost small" data-mv="${r}|${i}|-1" ${i === 0 ? 'disabled' : ''} aria-label="Move up">${icon('up')}</button><button class="btn icon ghost small" data-mv="${r}|${i}|1" ${i === chain.length - 1 ? 'disabled' : ''} aria-label="Move down">${icon('down')}</button><button class="btn icon ghost small" data-rm="${r}|${i}" aria-label="Remove">${icon('x')}</button></span></div>`).join('') || '<div class="note">No providers: the controller does this role itself.</div>'}</div>
      <select data-addsel="${r}" style="max-width:220px"><option value="">+ add provider…</option>${names.filter((n) => !chain.includes(n)).map((n) => `<option>${esc(n)}</option>`).join('')}</select></div>`).join('')}</div>`;
  },
  providers() {
    const field = (n, k, label, ph = '', list = '') => `<div><label class="f">${label}</label><input type="text" data-pf="${esc(n)}|${k}" value="${esc([].concat(W.providers[n][k] ?? '').join(', '))}" placeholder="${esc(ph)}" ${list ? `list="${list}"` : ''}></div>`;
    const permNote = (p) => { const m = { ...(S.presets[p.preset]?.permissions || {}), ...(p.permissions || {}) };
      if (!m.write) return '<div class="note">Permissions: custom CLI, check its own settings.</div>';
      return `<div class="note"><b>Write roles:</b> ${esc(m.write)}<br><b>Read roles:</b> ${esc(m.read)}${m.readOnlyEnforced ? '' : ' <span class="pill bad">read-only not enforced</span>'}</div>`; };
    const all = Object.keys(W.providers), on = all.filter((n) => W.providers[n].enabled);

      <div><label class="f">Protected branches</label><input type="text" data-setl="protectedBranches" value="${esc((st.protectedBranches || []).join(', '))}"><div class="note">Workers never write on these</div></div>
      </div><div style="margin-top:12px;display:grid;gap:6px">${chk('smartSelect', 'Smart selector: try the cheapest capable provider first (free API models for small tasks, agents for big ones)')}${chk('requireCleanTree', 'Require a clean git tree before write roles (enables safe stash-on-failure)')}${chk('autoVerify', 'Run verify automatically after each write task')}</div></div>`;
  },
  setup() {
    const p = S.presets, sec = Object.fromEntries(S.secrets.map((x) => [x.name, x.set]));
    const pill = (ok, yes, no) => ok ? `<span class="pill ok">${yes}</span>` : `<span class="pill bad">${no}</span>`;
    const agents = Object.values(p).filter((v) => v.installed).length;

    <div class="card"><h2>This machine</h2><table><tr><th>Check</th><th>Status</th><th>How to fix</th></tr>
      <tr><td>Node.js 20+</td><td>${pill(+S.env.node.slice(1).split('.')[0] >= 20, esc(S.env.node), esc(S.env.node) + ' (too old)')}</td><td class="mono">nvm install 22</td></tr>
      <tr><td>git</td><td>${pill(S.env.git, 'installed', 'missing')}</td><td class="note">Needed for worktrees, evidence checks and rollback</td></tr>
      <tr><td>conductor ${esc(S.version)}</td><td>${pill(S.env.conductorOnPath, 'on PATH', 'not on PATH')}</td><td class="note">${S.env.conductorOnPath ? 'Ready' : 'Add <span class="mono">$(npm prefix -g)/bin</span> to PATH'}</td></tr>
      <tr><td>This project</td><td>${pill(S.hasProjectConfig, 'initialised', 'not initialised')}</td><td class="mono">${S.hasProjectConfig ? '' : 'conductor init'}</td></tr>
      <tr><td>Worker agents</td><td>${pill(agents, agents + ' installed', 'none installed')}</td><td class="note">Optional: free API providers work without one</td></tr>
      <tr><td>Local models</td><td>${(() => { loadLocal(); const run = (localInfo || []).filter((l) => l.running); return !localInfo ? '<span class="pill">checking…</span>' : run.length ? `<span class="pill ok">${run.map((l) => esc(l.label)).join(', ')}</span>` : '<span class="pill">none running</span>'; })()}</td><td class="note">${(localInfo || []).find((l) => l.next)?.next ? esc((localInfo || []).find((l) => l.next).next) : 'Optional: <a href="https://ollama.com/download" target="_blank" rel="noopener">Ollama</a>, then <span class="mono">ollama pull qwen3-coder</span>'}</td></tr>
      <tr><td>Free API keys</td><td>${freeKeys ? `<span class="pill ok">${freeKeys} set</span>` : '<span class="pill">none yet</span>'}</td><td class="note">kilo-free works without a key</td></tr>
    </table></div>
    <div class="card"><h2>Steps</h2><ol class="steps">
      <li><b>Install conductor</b> (once per machine; run it again to update)${cmd('curl -fsSL https://raw.githubusercontent.com/KevalParikh22/conductor-ai/main/scripts/install.sh | bash')}<span class="note">Or with npm directly:</span>${cmd('npm install -g github:KevalParikh22/conductor-ai\nconductor setup')}<span class="note">If npm asks for sudo, use a Node version manager (nvm, fnm) instead.</span></li>
      <li><b>Pick your workers.</b> Choose a free start, subscription agents, or both. Every role falls back down its chain, so you can mix them.
        <div class="grid2" style="margin-top:10px">
          <div class="mini"><b>Free, no install</b><ul class="note" style="margin:6px 0 0;padding-left:18px">
            <li><b>kilo-free</b> and <b>OVHcloud</b>: no key at all</li>
            <li><b>OpenRouter</b>, <b>Gemini</b>, <b>Groq</b>, <b>Cerebras</b>: free keys</li>
            <li><b>Ollama</b>, <b>LM Studio</b>: local and private</li></ul>

          <div class="mini"><b>Coding agents (your subscriptions)</b><ul class="note" style="margin:6px 0 0;padding-left:0;list-style:none">
            ${Object.values(p).map((v) => `<li>${v.installed ? '✓' : '○'} <b>${esc(v.label)}</b></li>`).join('')}</ul>
            <span class="note">Agents edit files and run tests themselves, each under its own permission rules. Install commands are below.</span></div>
        </div></li>
      <li><b>Add providers</b>: <span class="mono">conductor add groq</span> asks for the key, picks a model and tests it. Or use <button class="btn small" data-goto="providers">Providers → Add provider</button></li>
      <li><b>Set up each project</b>${cmd('cd my-project\nconductor init            # controller: claude-code (default), antigravity, codex-cli, opencode')}<span class="note">Then fill in section 1 of AGENTS.md: the stack and the Verify command (for example <span class="mono">npm test</span>).</span></li>
      <li><b>Check everything</b>: <span class="mono">--live</span> sends one tiny prompt to each enabled provider and shows which ones answer.${cmd('conductor doctor --live')}</li>

      <li><b>Use it from your controller.</b> In Claude Code: <span class="mono">/conduct-plan add password reset</span>, answer the plan's open questions, then <span class="mono">/conduct-run docs/plan/password-reset.md</span>. Other controllers read the same instructions from AGENTS.md or GEMINI.md.</li>

      ${Object.values(p).map((v) => `<tr><td>${esc(v.label)}</td><td>${pill(v.installed, 'installed', 'missing')}</td><td>${cmd(v.install.split(/\s+\(or: /)[0])}${/\(or: /.test(v.install) ? `<span class="note">or: <span class="mono">${esc(v.install.split(/\(or: /)[1].replace(/\)$/, ''))}</span></span>` : ''}</td><td class="mono">${esc(v.login)}</td></tr>`).join('')}
    </table><p class="note">After installing, run <span class="mono">conductor setup</span> (it turns on what it finds) or switch the agent on in Providers.</p></details></div>
    <div class="card"><details class="more"><summary>${icon('chev')} <b style="color:var(--text)">Update or remove</b></summary>${cmd('npm install -g github:KevalParikh22/conductor-ai   # update to latest\nconductor --version\nnpm uninstall -g conductor-ai                       # remove')}<span class="note">Settings and keys stay in <span class="mono">${esc(S.paths.global.replace(/[^/\\]+$/, ''))}</span>. Delete that folder to remove them too.</span></details></div>
`;

function render() {
  renderNav();
  $('#main').innerHTML = views[tab]();
  bindCopy(); bind();
}

function bind() {
  document.querySelectorAll('[data-goto]').forEach((b) => b.onclick = () => { tab = b.dataset.goto; render(); });
  document.querySelectorAll('[data-clear]').forEach((b) => b.onclick = async () => { load(await api('POST', '/api/cooldowns/clear', { name: b.dataset.clear })); toast('Cooldown cleared'); });
  document.querySelectorAll('[data-mv]').forEach((b) => b.onclick = () => { const [r, i, d] = b.dataset.mv.split('|'); const c = W.roles[r]; const j = +i + +d; [c[i], c[j]] = [c[j], c[i]]; markDirty(); render(); });
  document.querySelectorAll('[data-rm]').forEach((b) => b.onclick = () => { const [r, i] = b.dataset.rm.split('|'); W.roles[r].splice(+i, 1); markDirty(); render(); });
  document.querySelectorAll('[data-addsel]').forEach((s) => s.onchange = () => { if (s.value) { W.roles[s.dataset.addsel].push(s.value); markDirty(); render(); } });
  document.querySelectorAll('[data-en]').forEach((c) => c.onchange = () => { W.providers[c.dataset.en].enabled = c.checked; markDirty(); render(); });
  document.querySelectorAll('[data-pf]').forEach((i) => i.oninput = () => {
    const [n, k] = i.dataset.pf.split('|'), v = i.value.trim(), pr = W.providers[n];
    if (k === 'fallbackModels') { const l = v.split(',').map((x) => x.trim()).filter(Boolean); if (l.length) pr[k] = l; else delete pr[k]; }
    else if (k === 'timeoutMin') { if (Number(v) > 0) pr[k] = Number(v); else delete pr[k]; }
    else pr[k] = v;
    markDirty(); });
  document.querySelectorAll('[data-test]').forEach((b) => b.onclick = async () => {
    const n = b.dataset.test, out = document.getElementById('test-' + n);
    out.style.paddingBottom = '10px';
    b.disabled = true; out.textContent = 'Testing… (CLI agents can take a minute)';
    try { const r = await api('POST', '/api/test', { name: n, provider: W.providers[n] }); out.innerHTML = r.ok ? '<span class="pill ok">✓ responded</span>' : `<span class="pill bad">✗ ${esc(r.reason)}</span> ${esc(r.sample)}`; }
    catch (e) { out.textContent = '✗ ' + e.message; } finally { b.disabled = false; }
  });
  document.querySelectorAll('[data-del]').forEach((b) => b.onclick = () => { const n = b.dataset.del; delete W.providers[n]; for (const c of Object.values(W.roles)) { const i = c.indexOf(n); if (i >= 0) c.splice(i, 1); } markDirty(); render(); });
  const ra = $('#rt-add'); if (ra) ra.onclick = () => {
    const r = { role: $('#rt-role').value, files: $('#rt-files').value.trim(), text: $('#rt-text').value.trim(), provider: $('#rt-prov').value };
    if (!r.role && !r.files && !r.text) return toast('Fill in a role, files or text to match on');
    if (!r.provider) return toast('Enable a provider first');
    if (r.text) { try { new RegExp(r.text); } catch { return toast('Task text is not a valid regex'); } }
    for (const k of ['role', 'files', 'text']) if (!r[k]) delete r[k];
    (W.routes ||= []).push(r); markDirty(); render(); toast('Rule added. Save to keep it');
  };
  const addLib = async (ids) => {
    try { const d = await api('POST', '/api/route-templates', { providers: W.providers, routes: W.routes || [], add: ids });
      W.routes = d.routes; markDirty(); rtLibKey = ''; render();
      toast(d.added.length ? `Added ${d.added.length} rule${d.added.length > 1 ? 's' : ''}. Save to keep ${d.added.length > 1 ? 'them' : 'it'}` : d.skipped.map((x) => `${x.id}: ${x.why}`).join('; ') || 'Nothing to add');
    } catch (e) { toast(e.message); } };
  const ld = $('#rt-libd'); if (ld) ld.ontoggle = () => { rtLibOpen = ld.open; };
  const rs = $('#rt-starter'); if (rs) rs.onclick = () => addLib(rtLib.filter((t) => t.starter).map((t) => t.id));
  document.querySelectorAll('[data-rtlib]').forEach((b) => b.onclick = () => addLib([b.dataset.rtlib]));
  document.querySelectorAll('[data-rtedit]').forEach((b) => b.onclick = () => {
    const r = rtLib.find((t) => t.id === b.dataset.rtedit).route;
    $('#rt-role').value = r.role || ''; $('#rt-files').value = [].concat(r.files || []).join(', '); $('#rt-text').value = r.text || '';
    const p = [].concat(r.provider)[0]; if (p) $('#rt-prov').value = p;
    $('#rt-files').scrollIntoView({ block: 'center' }); toast('Copied into the form: change it, then Add rule');
  });
  document.querySelectorAll('[data-rtrm]').forEach((b) => b.onclick = () => { W.routes.splice(+b.dataset.rtrm, 1); markDirty(); render(); });
  document.querySelectorAll('[data-rtmv]').forEach((b) => b.onclick = () => { const [i, d] = b.dataset.rtmv.split('|').map(Number); const a = W.routes; [a[i], a[i + d]] = [a[i + d], a[i]]; markDirty(); render(); });
  document.querySelectorAll('[data-local]').forEach((b) => b.onclick = async () => {
    if (dirty) return toast('Save or discard your other changes first');
    const [id, model] = b.dataset.local.split('|');
    b.disabled = true;
    try { const r = await api('POST', '/api/providers/add', { id, model, scope: $('#scope').value }); load(r); localAt = 0; loadLocal(); toast(`${r.added.name} on with ${r.added.model}`); } catch (e) { toast(e.message); b.disabled = false; }
  });
  const pv = $('#pv-go'); if (pv) pv.onclick = async () => {
    const input = { role: $('#pv-role').value, task: $('#pv-task').value, files: $('#pv-files').value };
    try { rPreview = { ...(await api('POST', '/api/route-preview', { ...input, routes: W.routes || [], roles: W.roles })), input }; render(); } catch (e) { toast(e.message); }
  };
  document.querySelectorAll('[data-popen]').forEach((b) => b.onclick = () => { const n = b.dataset.popen; pOpen.has(n) ? pOpen.delete(n) : pOpen.add(n); render(); });
  document.querySelectorAll('[data-pall]').forEach((b) => b.onclick = () => { pAll = b.dataset.pall === '1'; render(); });
  const pa = $('#padd'); if (pa) pa.onclick = () => { pAdd = !pAdd; gOpen = null; render(); if (pAdd) $('#g-q')?.focus(); };
  // typing searches every category; a chip narrows the current search
  const gq = $('#g-q'); if (gq) gq.oninput = () => { gFilter.q = gq.value; if (gFilter.q) gFilter.cat = 'all'; applyGalleryFilter(); };
  document.querySelectorAll('[data-gcat]').forEach((b) => b.onclick = () => { gFilter.cat = b.dataset.gcat; applyGalleryFilter(); });
  document.querySelectorAll('[data-gadd]').forEach((b) => b.onclick = () => { gOpen = b.dataset.gadd; render(); $('#g-key')?.focus(); });
  document.querySelectorAll('[data-gclose]').forEach((b) => b.onclick = () => { gOpen = null; render(); });
  document.querySelectorAll('[data-gsave]').forEach((b) => b.onclick = async () => {
    if (dirty) return toast('Save or discard your other changes first');
    const fields = {}; document.querySelectorAll('[data-gfield]').forEach((i) => { fields[i.dataset.gfield] = i.value.trim(); });
    b.disabled = true; b.textContent = 'Adding…';
    try {
      const r = await api('POST', '/api/providers/add', { id: b.dataset.gsave, key: $('#g-key')?.value.trim() || undefined, fields, scope: $('#scope').value });
      gOpen = null; load(r);
      toast(`${r.added.name} added${r.added.model ? ` (${r.added.model})` : ''}. ${r.added.warning || 'Use Test on its card.'}`);
    } catch (e) { toast(e.message); b.disabled = false; b.textContent = 'Add and enable'; }
  });
  document.querySelectorAll('[data-lm]').forEach((b) => b.onclick = async () => {
    b.disabled = true; b.textContent = 'Loading…';
    try { const r = await api('POST', '/api/provider-models', { name: b.dataset.lm }); if (r.error) toast(r.error); else { provModels[b.dataset.lm] = r.models; toast(`${r.models.length} models`); } } catch (e) { toast(e.message); }
    render();
  });
  const lf = $('#loadfree'); if (lf) lf.onclick = async () => { lf.disabled = true; lf.textContent = 'Loading…'; try { freeModels = (await api('GET', '/api/models')).models; toast(`${freeModels.length} free models`); } catch (e) { toast(e.message); } render(); };
  const add = $('#np-add'); if (add) add.onclick = () => {
    const name = $('#np-name').value.trim(), type = $('#np-type').value, base = $('#np-base').value.trim();
    if (!/^[a-z0-9][a-z0-9-]*$/.test(name)) return toast('Name: lowercase letters, digits and dashes');
    if (W.providers[name]) return toast('That name exists');
    W.providers[name] = type === 'cli' ? { type, preset: base || 'opencode', enabled: true, model: $('#np-model').value.trim() }
      : { type, enabled: true, baseUrl: base, apiKeyEnv: $('#np-key').value.trim(), model: $('#np-model').value.trim() };
    markDirty(); render(); toast('Added. Put it in a role chain, then Save');
  };
  document.querySelectorAll('[data-savekey]').forEach((b) => b.onclick = async () => {
    const k = b.dataset.savekey, v = document.querySelector(`[data-key="${k}"]`).value.trim(); if (!v) return toast('Paste a key first');
    try { load(await api('PUT', '/api/secrets', { updates: { [k]: v } })); toast(`${k} saved`); } catch (e) { toast(e.message); }
  });
  document.querySelectorAll('[data-delkey]').forEach((b) => b.onclick = async () => { try { load(await api('PUT', '/api/secrets', { updates: { [b.dataset.delkey]: null } })); toast('Removed'); } catch (e) { toast(e.message); } });
  document.querySelectorAll('input[name=ctrl]').forEach((r) => r.onchange = () => { W.controller = r.value; markDirty(); render(); });
  const ap = $('#apply-ctrl'); if (ap) ap.onclick = async () => {
    ap.disabled = true;
    try {
      const r = await api('POST', '/api/init', { controller: W.controller, mcp: $('#ctrl-mcp').checked });
      const out = r.lines.join('\n') + (r.notes.length ? '\n\n' + r.notes.join('\n') : '');
      S = r.state; W.controller = S.effective.controller; render();
      const pre = $('#init-out'); pre.style.display = 'block'; pre.textContent = out; toast('Project updated');
    } catch (e) { toast(e.message); ap.disabled = false; }
  };
  document.querySelectorAll('[data-set]').forEach((i) => i.oninput = () => { W.settings[i.dataset.set] = Number(i.value); markDirty(); });
  document.querySelectorAll('[data-sets]').forEach((i) => i.oninput = () => { W.settings[i.dataset.sets] = i.value; markDirty(); });
  document.querySelectorAll('[data-setl]').forEach((i) => i.oninput = () => { W.settings[i.dataset.setl] = i.value.split(',').map((x) => x.trim()).filter(Boolean); markDirty(); });
  document.querySelectorAll('[data-setb]').forEach((i) => i.onchange = () => { W.settings[i.dataset.setb] = i.checked; markDirty(); });
}

(async () => {
  try { const sc = localStorage.getItem('conductor-scope'); if (sc) $('#scope').value = sc; } catch {}
  if (!TOKEN) { $('#main').innerHTML = '<div class="err">Missing access token. Open the full URL printed by <span class="mono">conductor ui</span>.</div>'; return; }
  try { const st = await api('GET', '/api/state'); if (!st.hasProjectConfig && !localStorage.getItem('conductor-scope')) $('#scope').value = 'global'; load(st); }
  catch (e) { $('#main').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
})();
window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
</script>
</body>
</html>
