name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "${{ matrix.node }}" }
      - run: git config --global user.email ci@example.com && git config --global user.name ci && git config --global core.autocrlf false
        shell: bash
      - run: npm test -- --test-reporter=tap 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - if: failure()
        run: node scripts/ci-annotate.mjs test-output.txt
        shell: bash
  plugin:
    # the Claude Code plugin and marketplace manifests, checked by Claude Code itself (offline, no login needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - run: npx -y @anthropic-ai/claude-code@2.1.317 plugin validate .
