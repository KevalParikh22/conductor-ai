# Have Claude (controller) execute a conductor plan in CI, delegating to cloud API workers.
# Copy to .github/workflows/conduct.yml in your project. Needs repo secrets for the keys you use.
name: conduct
on:
  workflow_dispatch:
    inputs:
      plan: { description: "Plan slug (docs/plan/<slug>.md)", required: true }
permissions: { contents: write, pull-requests: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g github:YOUR-GITHUB-USER/conductor-ai
      - run: git switch -c conduct/${{ inputs.plan }}-${{ github.run_id }}
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/conduct-run docs/plan/${{ inputs.plan }}.md. When done, push the branch and open a pull request."
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
